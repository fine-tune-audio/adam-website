<!DOCTYPE html>
<html lang="nl">
<head>
  <meta name="i18n-page" content="signup">
  <script>try{var __p=new URLSearchParams(location.search).get('lang'),__l=(__p||localStorage.getItem('adam.lang')||'nl').toLowerCase();if(__l!=='nl')document.documentElement.classList.add('i18n-pending');}catch(e){}</script>
  <script type="module" src="i18n.js"></script>
  <style>.i18n-pending body{visibility:hidden;}</style>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title data-i18n="meta.signup.title">Aanmelden | ADAM AI Agents</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    :root{--blue:#1D2ED8;--yellow:#CEFF1A;--black:#0A0A0A;--white:#FFFFFF;--gray:#E5E7EB;--gray-mid:#6B7280;--off:#F8F8F8;}
    body{font-family:'Sora',sans-serif;background:var(--black);color:var(--white);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;}
    :focus-visible{outline:3px solid var(--yellow);outline-offset:2px;}
    .box{background:var(--white);color:var(--black);border-radius:8px;padding:36px 32px;width:min(440px,100%);}
    .label{font-size:12px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--blue);margin-bottom:12px;}
    h1{font-size:26px;font-weight:800;letter-spacing:-0.03em;margin-bottom:8px;}
    p.sub{font-size:14px;color:var(--gray-mid);line-height:1.6;margin-bottom:24px;}
    label{display:block;font-size:13px;font-weight:700;margin-bottom:6px;}
    input{width:100%;font-family:inherit;font-size:15px;padding:12px 14px;border:1px solid var(--gray);border-radius:4px;margin-bottom:16px;}
    button.go{width:100%;font-family:inherit;font-size:15px;font-weight:700;padding:14px 20px;border:0;border-radius:4px;background:var(--blue);color:#fff;cursor:pointer;}
    button.go:hover{opacity:0.85;}
    .err{color:#B91C1C;font-size:13px;font-weight:600;margin:-8px 0 16px;}
    .summary{background:var(--off);border-radius:6px;padding:16px 18px;margin-bottom:20px;font-size:14px;line-height:1.7;}
    .summary strong{font-weight:800;}
    .note{font-size:12px;color:var(--gray-mid);margin-top:16px;line-height:1.5;}
    a.back{display:inline-block;margin-top:20px;font-size:13px;font-weight:600;color:var(--gray-mid);text-decoration:none;}
    [hidden]{display:none!important;}
  </style>
</head>
<body>
<main class="box">
  <div class="label" data-i18n-skip>ADAM</div>

  <section id="gate">
    <h1 data-i18n="signup.gate.title">Aanmelden</h1>
    <p class="sub" data-i18n="signup.gate.sub">Voer het wachtwoord in om verder te gaan.</p>
    <form id="gateForm" autocomplete="off">
      <label for="pw" data-i18n="signup.gate.password">Wachtwoord</label>
      <input id="pw" type="password" required autofocus>
      <p class="err" id="gateErr" data-i18n="signup.gate.error" hidden>Onjuist wachtwoord.</p>
      <button class="go" type="submit" data-i18n="signup.gate.continue">Doorgaan</button>
    </form>
  </section>

  <section id="account" hidden>
    <h1 data-i18n="signup.pay.title">Betalen</h1>
    <p class="sub" data-i18n="signup.pay.sub">Voorbeeldstap: betalingen zijn nog niet actief. Klik hieronder om door te gaan naar het aanmaken van je account.</p>
    <div class="summary" id="summary"></div>
    <button class="go" id="payBtn" type="button" data-i18n="signup.pay.button">Betaal hier</button>
    <p class="note" data-i18n="signup.pay.note">Er wordt niets in rekening gebracht.</p>
  </section>

  <a class="back" href="pricing.html" data-i18n="signup.back">&larr; Terug naar prijzen</a>
</main>

<script type="module">
  import { t, getLang, ready } from './i18n.js';
  import { PLANS, displayPriceFor, formatMoney } from './pricing-config.js';

  // Placeholder gate only. Not real security: replace with real signup + billing.
  const PASSWORD = 'pasta123';
  const q = new URLSearchParams(location.search);
  const plan = PLANS.find((p) => p.id === q.get('plan')) || PLANS[1];
  const interval = q.get('interval') === 'annual' ? 'annual' : 'monthly';

  const $ = (id) => document.getElementById(id);
  const show = (id) => ['gate', 'account'].forEach((s) => { $(s).hidden = s !== id; });

  const name = plan.id.charAt(0).toUpperCase() + plan.id.slice(1);
  function renderSummary() {
    const price = formatMoney(displayPriceFor(plan, interval), { lang: getLang() });
    const line = t('signup.summary.price').replace('{price}', price);
    $('summary').innerHTML = `<strong>${name}</strong><br>${line}<br>${t(interval === 'annual' ? 'signup.summary.annual' : 'signup.summary.monthly')}`;
  }
  ready.then(renderSummary);
  document.addEventListener('adam:langchange', renderSummary);

  show('gate');

  $('gateForm').addEventListener('submit', (e) => {
    e.preventDefault();
    if ($('pw').value === PASSWORD) {
      show('account');
    } else {
      $('gateErr').hidden = false;
      $('pw').select();
    }
  });

  // Placeholder for the payment step: go straight to the real app signup + onboarding.
  const APP_SIGNUP = 'https://app.adamagents.nl/signup';
  $('payBtn').addEventListener('click', () => {
    location.href = `${APP_SIGNUP}?code=pasta123&plan=${encodeURIComponent(plan.id)}&interval=${interval}`;
  });
</script>
</body>
</html>
