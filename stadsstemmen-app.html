<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Stadsstemmen · Groningen</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://unpkg.com/@elevenlabs/convai-widget-embed" async type="text/javascript"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;600;700;800;900&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#e9eae5; --ink:#14150f; --ink-2:#4a4c44; --muted:#76786e;
    --line:rgba(20,21,15,.12);
    --surface:rgba(255,255,255,.74); --surface-solid:#fbfbf8; --glass-brd:rgba(255,255,255,.7);
    --lime:#c8f23c; --lime-l:#e6ff86; --lime-d:#9fce1c; --blue:#5db8ff;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{font-family:'Hanken Grotesk',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden;background:var(--bg);}

  .stage{height:100%;display:flex;align-items:center;justify-content:center;}
  .app{position:relative;width:100%;max-width:440px;height:100%;max-height:940px;overflow:hidden;background:var(--bg);}
  @media(min-width:480px){.stage{padding:22px;}.app{border-radius:36px;box-shadow:0 40px 120px rgba(0,0,0,.35);}}

  /* ===== KAART ===== */
  #map{position:absolute;inset:0;z-index:1;background:#e9eae5;}
  .leaflet-container{background:#e9eae5;font-family:inherit;}
  .leaflet-tile{filter:grayscale(.35) brightness(1.04) contrast(.96);}
  .place-pin .dot{display:block;width:24px;height:24px;border-radius:50%;background:var(--lime);
    border:3px solid var(--ink);box-shadow:0 3px 9px rgba(0,0,0,.28);box-sizing:border-box;}
  .me-pin .d{display:block;width:30px;height:30px;border-radius:50%;background:#fff;border:3px solid var(--ink);
    box-shadow:0 5px 14px rgba(0,0,0,.32);box-sizing:border-box;position:relative;cursor:grab;}
  .me-pin .d::after{content:'';position:absolute;inset:6px;border-radius:50%;background:var(--blue);}
  .me-pin .d:active{cursor:grabbing;}
  .leaflet-tooltip.lm-tip{background:var(--ink);border:none;box-shadow:0 3px 10px rgba(0,0,0,.25);color:#fff;
    font-family:'Hanken Grotesk';font-size:11px;font-weight:700;padding:4px 9px;border-radius:8px;}
  .leaflet-tooltip.lm-tip::before{display:none;}

  /* ===== TOP BAR (basic) ===== */
  .top{position:absolute;z-index:6;top:0;left:0;right:0;padding:16px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .chip{display:flex;align-items:center;gap:9px;padding:10px 15px;border-radius:14px;background:var(--surface);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--glass-brd);box-shadow:0 6px 20px rgba(0,0,0,.10);}
  .chip .dotmk{width:9px;height:9px;border-radius:50%;background:var(--lime);border:1.5px solid var(--ink);flex-shrink:0;}
  .chip .mk{font-family:'Schibsted Grotesk';font-weight:800;font-size:16px;letter-spacing:-.02em;}
  .seg{display:flex;gap:3px;padding:3px;border-radius:13px;background:var(--surface);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border:1px solid var(--glass-brd);box-shadow:0 6px 18px rgba(0,0,0,.10);}
  .seg button{border:none;background:transparent;color:var(--muted);font-family:inherit;font-weight:800;font-size:10px;
    letter-spacing:.08em;text-transform:uppercase;padding:9px 13px;border-radius:10px;cursor:pointer;transition:.16s;}
  .seg button.on{background:var(--ink);color:var(--lime);}

  /* demo-hint op de kaart */
  .maphint{position:absolute;z-index:5;top:74px;left:50%;transform:translateX(-50%);
    display:flex;align-items:center;gap:8px;padding:9px 15px;border-radius:999px;background:var(--surface);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--glass-brd);
    box-shadow:0 6px 18px rgba(0,0,0,.10);font-size:12px;font-weight:600;color:var(--ink-2);white-space:nowrap;transition:.3s;}
  .maphint.hide{opacity:0;transform:translate(-50%,-8px);pointer-events:none;}
  .maphint .b{width:13px;height:13px;border-radius:50%;background:#fff;border:2px solid var(--ink);position:relative;}
  .maphint .b::after{content:'';position:absolute;inset:2.5px;border-radius:50%;background:var(--blue);}

  /* ===== SLIDE-PANEEL ===== */
  .sheet{position:absolute;z-index:8;left:0;right:0;bottom:0;height:55%;
    background:var(--surface);backdrop-filter:blur(30px) saturate(1.4);-webkit-backdrop-filter:blur(30px) saturate(1.4);
    border-top:1px solid var(--glass-brd);border-radius:30px 30px 0 0;
    box-shadow:0 -18px 50px rgba(0,0,0,.18), 0 -1px 0 rgba(255,255,255,.8) inset;display:flex;flex-direction:column;overflow:hidden;}
  .drag{flex-shrink:0;cursor:grab;touch-action:none;padding:13px 0 6px;}
  .drag:active{cursor:grabbing;}
  .grip{width:44px;height:5px;border-radius:9px;background:rgba(20,21,15,.22);margin:0 auto;}

  /* lijst */
  .list-view{display:flex;flex-direction:column;flex:1;min-height:0;}
  .list-head{padding:8px 24px 16px;}
  .list-head .eb{font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--muted);}
  .list-head .ttl{font-family:'Schibsted Grotesk';font-weight:800;font-size:28px;letter-spacing:-.03em;line-height:1.04;margin-top:5px;}
  .cards{flex:1;overflow-y:auto;padding:2px 16px 24px;display:flex;flex-direction:column;gap:11px;}
  .cards::-webkit-scrollbar{width:6px;}.cards::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px;}
  .card{display:flex;align-items:center;gap:16px;padding:16px 16px 16px 20px;border-radius:18px;cursor:pointer;
    background:var(--surface-solid);border:1px solid var(--line);transition:.16s;box-shadow:0 2px 8px rgba(0,0,0,.04);}
  .card:hover{box-shadow:0 8px 22px rgba(0,0,0,.10);transform:translateY(-1px);}
  .card:active{transform:scale(.99);}
  .card .meta{flex:1;min-width:0;}
  .card .num{font-family:'Schibsted Grotesk';font-weight:700;font-size:11px;color:var(--muted);letter-spacing:.06em;}
  .card .nm{font-family:'Schibsted Grotesk';font-weight:800;font-size:18px;letter-spacing:-.02em;line-height:1.1;margin-top:3px;}
  .card .ch{font-size:12.5px;color:var(--muted);margin-top:3px;}
  .card .go{width:46px;height:46px;border-radius:50%;background:var(--ink);color:var(--lime);flex-shrink:0;display:grid;place-items:center;font-size:19px;}

  /* gesprek */
  .convo-view{flex:1;display:none;flex-direction:column;min-height:0;}
  .sheet.detail .list-view{display:none;}
  .sheet.detail .convo-view{display:flex;}
  .cv-head{padding:4px 20px 0;display:flex;align-items:center;gap:14px;}
  .back{width:44px;height:44px;border-radius:50%;background:var(--ink);color:var(--lime);border:none;font-size:19px;cursor:pointer;display:grid;place-items:center;flex-shrink:0;}
  .cv-title{min-width:0;}
  .cv-title .eyebrow{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);}
  .cv-title .nm{font-family:'Schibsted Grotesk';font-weight:800;font-size:22px;letter-spacing:-.03em;line-height:1.05;margin-top:3px;}
  .cv-title .ch{font-size:12.5px;color:var(--ink-2);font-weight:600;margin-top:3px;}

  /* ronde praatknop met gradient-ring */
  .talk-wrap{display:flex;flex-direction:column;align-items:center;padding:18px 0 6px;}
  .talk{position:relative;width:92px;height:92px;cursor:pointer;}
  .talk .ring{position:absolute;inset:0;border-radius:50%;
    background:conic-gradient(from 0deg, var(--lime-l), var(--lime), var(--lime-d), #6f9e10, var(--lime-d), var(--lime), var(--lime-l));
    -webkit-mask:radial-gradient(closest-side, transparent 70%, #000 72%);
            mask:radial-gradient(closest-side, transparent 70%, #000 72%);
    animation:spin 5s linear infinite;filter:drop-shadow(0 4px 14px rgba(167,211,31,.45));}
  .talk .btn{position:absolute;inset:11px;border-radius:50%;display:grid;place-items:center;
    background:radial-gradient(120% 120% at 35% 25%, #ffffff 0%, #f4fbe2 30%, #e7f7b4 100%);
    border:1px solid rgba(20,21,15,.10);box-shadow:0 6px 16px rgba(0,0,0,.14), 0 1px 0 rgba(255,255,255,.9) inset;}
  .talk .btn svg{width:26px;height:26px;color:var(--ink);}
  .talk:active .btn{transform:scale(.96);}
  .talk.speaking .ring{animation-duration:1.6s;filter:drop-shadow(0 4px 22px rgba(167,211,31,.8));}
  @keyframes spin{to{transform:rotate(360deg);}}
  .talk-label{font-size:12px;color:var(--muted);margin-top:12px;font-weight:600;}

  .convo{flex:1;overflow-y:auto;padding:14px 20px 4px;display:flex;flex-direction:column;gap:11px;min-height:54px;}
  .convo::-webkit-scrollbar{width:6px;}.convo::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px;}
  .msg{max-width:84%;padding:12px 16px;border-radius:17px;line-height:1.5;font-size:14.5px;animation:rise .3s ease both;}
  @keyframes rise{from{opacity:0;transform:translateY(7px);}to{opacity:1;transform:none;}}
  .msg.them{align-self:flex-start;background:var(--surface-solid);border:1px solid var(--line);border-top-left-radius:5px;font-family:'Schibsted Grotesk';font-weight:600;}
  .msg.me{align-self:flex-end;background:var(--lime);color:var(--ink);border-top-right-radius:5px;font-weight:700;}
  .typing{align-self:flex-start;display:flex;gap:5px;padding:14px 16px;}
  .typing i{width:7px;height:7px;border-radius:50%;background:var(--lime-d);animation:bl 1.1s infinite;}
  .typing i:nth-child(2){animation-delay:.18s;}.typing i:nth-child(3){animation-delay:.36s;}
  @keyframes bl{0%,100%{opacity:.3;transform:translateY(0);}50%{opacity:1;transform:translateY(-3px);}}

  .sugs{display:flex;gap:9px;overflow-x:auto;padding:10px 18px;scrollbar-width:none;}
  .sugs::-webkit-scrollbar{display:none;}
  .sug{flex-shrink:0;font-size:12.5px;font-weight:700;padding:9px 15px;border-radius:999px;background:var(--surface-solid);
    border:1px solid var(--line);color:var(--ink-2);cursor:pointer;white-space:nowrap;transition:.15s;}
  .sug:hover{border-color:var(--ink);color:var(--ink);}
  .composer{display:flex;gap:10px;padding:8px 18px calc(18px + env(safe-area-inset-bottom));align-items:flex-end;}
  .field{flex:1;display:flex;align-items:center;background:var(--surface-solid);border:1px solid var(--line);border-radius:15px;padding:3px 4px 3px 17px;}
  .field:focus-within{border-color:var(--ink);}
  .field textarea{flex:1;background:none;border:none;outline:none;color:var(--ink);font-family:inherit;font-size:14.5px;resize:none;padding:12px 0;max-height:90px;line-height:1.35;}
  .field textarea::placeholder{color:var(--muted);}
  .send{width:44px;height:44px;border:none;border-radius:13px;cursor:pointer;flex-shrink:0;background:var(--ink);color:var(--lime);font-size:18px;display:grid;place-items:center;}
  .send:disabled{opacity:.4;}
  .go svg,.back svg{width:21px;height:21px;}
  .send svg{width:19px;height:19px;}

  .setup{position:absolute;z-index:7;bottom:calc(55% + 14px);left:14px;right:14px;padding:12px 15px;border-radius:14px;
    background:var(--surface);backdrop-filter:blur(16px);border:1px solid var(--glass-brd);box-shadow:0 8px 24px rgba(0,0,0,.10);
    font-size:11.5px;line-height:1.45;color:var(--ink-2);display:flex;gap:10px;align-items:flex-start;transition:.3s;}
  .setup b{color:var(--ink);}
  .setup .x{margin-left:auto;background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;flex-shrink:0;}
  .setup.hide{display:none;}
</style>
</head>
<body>
<div class="stage">
  <div class="app" id="app">
    <div id="map"></div>

    <div class="top">
      <div class="chip"><span class="dotmk"></span><span class="mk">Stads<b>stemmen</b></span></div>
      <div class="seg"><button id="mDemo" class="on">Demo</button><button id="mLive">Live</button></div>
    </div>

    <div class="maphint" id="maphint"><span class="b"></span>Sleep je locatie over een plek</div>

    <div class="setup" id="setup">
      <span>🎙️</span>
      <span><b>Preview.</b> Nog geen ElevenLabs agent-id's — plekken antwoorden als tekst. Vul de id's bovenin het bestand in voor de echte stemmen.</span>
      <button class="x" id="setupX">×</button>
    </div>

    <!-- SLEEPBAAR PANEEL -->
    <div class="sheet" id="sheet">
      <div class="drag" id="drag"><div class="grip"></div></div>

      <div class="list-view">
        <div class="list-head"><div class="eb">5 stemmen · binnenstad</div><div class="ttl">Plekken in de buurt</div></div>
        <div class="cards" id="cards"></div>
      </div>

      <div class="convo-view">
        <div class="cv-head">
          <button class="back" id="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12H6"/><path d="M11 6l-6 6 6 6"/></svg></button>
          <div class="cv-title"><div class="eyebrow" id="eyebrow">Demo · je bezoekt</div><div class="nm" id="sName">—</div><div class="ch" id="sChar"></div></div>
        </div>
        <div class="talk-wrap">
          <div class="talk" id="talk"><div class="ring"></div>
            <div class="btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 19v3"/></svg></div>
          </div>
          <div class="talk-label" id="talkLabel">Tik om te praten</div>
        </div>
        <div class="convo" id="convo"></div>
        <div class="sugs" id="sugs"></div>
        <div class="composer"><div class="field"><textarea id="input" rows="1" placeholder="Of typ je vraag…"></textarea></div><button class="send" id="send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V6"/><path d="M6 11l6-6 6 6"/></svg></button></div>
      </div>
    </div>

    <div id="widgetMount"></div>
  </div>
</div>

<script>
const ELEVENLABS_AGENT_IDS = { martini:"", provinciehuis:"", stadhuis:"", forum:"", vismarkt:"" };

const ZONES = [
  { id:'martini', name:'Martinitoren & -kerk', character:"d'Olle Grieze",
    polygon:[[53.219088,6.568073],[53.219408,6.569666],[53.219922,6.569382],[53.219571,6.567802]],
    sugs:['Waarom heet je d\u2019Olle Grieze?','Hoe hoog kom ik?','Wat heb je zien gebeuren?'],
    persona:`Jij BENT de Martinitoren \u00e9n de Martinikerk van Groningen, samen d'Olle Grieze. Ruim 500 jaar oud, 97 meter, het oudste oog van de stad. Statig, droog, een tikje belerend maar warm. In de kerk hangt het beroemde Schnitger-orgel. Je noemt de bezoeker "kleine".`,
    fallback:["Zo. Daar sta je dan, omhoog te turen zoals iedereen. Vijfhonderd jaar doe ik dat al andersom. Vraag gerust, kleine.","Hoor je het orgel beneden? Dat is m'n hart dat klopt. Zevenennegentig meter steen, en tóch blijft de muziek hangen."] },
  { id:'provinciehuis', name:'Provinciehuis', character:'De raadsheer',
    polygon:[[53.219416,6.569728],[53.219565,6.570964],[53.220288,6.570221],[53.22024,6.569668],[53.219926,6.569478]],
    sugs:['Wat gebeurt hier?','Vertel over de provincie','Wat is de Statenzaal?'],
    persona:`Jij BENT het Provinciehuis van Groningen, eeuwenoude zetel van het provinciaal bestuur aan het Martinikerkhof, met de Statenzaal. Deftig, bedachtzaam, met gravitas. Trots op de provincie en de Ommelanden.`,
    fallback:["Welkom. Achter deze gevels wordt de provincie bestuurd \u2014 al eeuwen, in de Statenzaal. Neem de tijd; goede beslissingen ook.","De stad denkt graag dat zij Groningen \u00ed\u015b. Maar ik waak over de hele provincie: de Ommelanden, de wierden, het wijde land."] },
  { id:'stadhuis', name:'Stadhuis', character:'De officiële stem',
    polygon:[[53.218261,6.567762],[53.217985,6.566777],[53.218919,6.566179],[53.219136,6.567155],[53.21867,6.567491]],
    sugs:['Wie bestuurt de stad?','Wat gebeurde hier in de oorlog?','Hoe oud ben je?'],
    persona:`Jij BENT het Stadhuis van Groningen (neoclassicistisch, begin 19e eeuw) aan de Grote Markt. Formeel, civiel, ordelijk, droog. Je draagt het oorlogsverhaal: de oostkant van de Grote Markt werd in april 1945 verwoest bij de Slag om Groningen.`,
    fallback:["Goedendag. Hier zetelt het stadsbestuur, netjes en volgens de regels. Waarmee kan ik u van dienst zijn?","In april 1945 lag de oostkant van dit plein in puin. Wat u nu ziet is grotendeels weer opgebouwd. De stad herstelt; dat doet ze altijd."] },
  { id:'forum', name:'Forum Groningen', character:'De nieuwkomer',
    polygon:[[53.218414,6.568695],[53.218881,6.56836],[53.219367,6.571009],[53.218622,6.571298]],
    sugs:['Wat kan ik bij jou doen?','Hoe is dat uitzicht?','Is de oude toren jaloers?'],
    persona:`Jij BENT het Forum Groningen (2019). Jong, modern, energiek, een beetje opschepperig over je dakterras en uitzicht. Vlotte taal. Je plaagt de oude Martinitoren.`,
    fallback:["Hey! Welkom. Ja, ik ben de nieuwe. Ga naar het dak \u2014 beste uitzicht van Groningen, en die ouwe toren is stiekem jaloers.","Bij mij? Boeken, films, exposities, koffie met uitzicht op het dak. Oud en nieuw onder \u00e9\u00e9n dak. Letterlijk."] },
  { id:'vismarkt', name:'Vismarkt', character:'De oude handelaar',
    polygon:[[53.217866,6.565988],[53.217549,6.566433],[53.217058,6.565251],[53.216425,6.563148],[53.216045,6.561743],[53.21662,6.561517]],
    sugs:['Verkoop je nog vis?','Wat werd hier verhandeld?','Vertel een goeie deal'],
    persona:`Jij BENT de Vismarkt van Groningen, met de Korenbeurs en zicht op de A-kerk. Een gezouten oude koopman: praktisch, recht voor z'n raap, gek op handel, eten en een goeie deal. Droge grappen.`,
    fallback:["Vis? Heb ik niet meer, jongen \u2014 die tijden zijn voorbij. Maar handel, een goeie deal? D\u00e1\u00e1r ben ik nog de beste in.","Hier werd alles verhandeld: vis, graan, geld. Schreeuwen en pingelen tot zonsondergang. De Korenbeurs staat er nog \u2014 ik ook."] }
];

const $=s=>document.querySelector(s);
let active=null, mode='demo', watch=null, liveMe=null, demoMe=null, demoZone=null;
const histories={}; ZONES.forEach(z=>histories[z.id]=[]);

/* ===== KAART ===== */
let map=null, bounds=[];
try{
  map=L.map('map',{zoomControl:false,attributionControl:false}).setView([53.2185,6.5662],16);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{subdomains:'abcd',maxZoom:20}).addTo(map);
  const path=[];
  ZONES.forEach(z=>{
    const poly=L.polygon(z.polygon,{color:'#14150f',weight:1.2,opacity:.45,fillColor:'#c8f23c',fillOpacity:.22}).addTo(map);
    poly.on('click',()=>openPlace(z.id));
    const ctr=poly.getBounds().getCenter(); path.push(ctr);
    const m=L.marker(ctr,{icon:L.divIcon({className:'place-pin',iconSize:[24,24],iconAnchor:[12,12],html:'<span class="dot"></span>'})}).addTo(map);
    m.bindTooltip(z.name,{direction:'top',className:'lm-tip',offset:[0,-14]});
    m.on('click',()=>openPlace(z.id));
    z._center=ctr; z.polygon.forEach(p=>bounds.push(p));
  });
  L.polyline(path,{color:'#9fce1c',weight:3,dashArray:'2 9',lineCap:'round',opacity:.9}).addTo(map);
  const fit=()=>{try{map.invalidateSize();if(bounds.length)map.fitBounds(bounds,{paddingTopLeft:[60,110],paddingBottomRight:[60,380]});}catch(e){}};
  fit(); setTimeout(fit,300); window.addEventListener('load',()=>setTimeout(fit,200));
  window.addEventListener('resize',()=>{try{map.invalidateSize();}catch(e){}});
}catch(e){}

/* ===== SLIDE ===== */
const sheet=$('#sheet'), dragEl=$('#drag');
const appH=()=>sheet.parentElement.clientHeight;
const snaps=()=>[0.30,0.58,0.92].map(f=>Math.round(f*appH()));
function nearest(h){return snaps().reduce((a,b)=>Math.abs(b-h)<Math.abs(a-h)?b:a);}
function setH(h,anim=true){ sheet.style.transition=anim?'height .4s cubic-bezier(.22,1,.36,1)':'none'; sheet.style.height=h+'px'; syncSetup(); }
let dragging=false,sy=0,sh=0;
dragEl.addEventListener('pointerdown',e=>{dragging=true;sy=e.clientY;sh=sheet.offsetHeight;sheet.style.transition='none';try{dragEl.setPointerCapture(e.pointerId);}catch(_){}});
window.addEventListener('pointermove',e=>{if(!dragging)return;const s=snaps();let h=sh+(sy-e.clientY);h=Math.max(s[0]*0.6,Math.min(s[s.length-1],h));sheet.style.height=h+'px';syncSetup();});
window.addEventListener('pointerup',()=>{if(!dragging)return;dragging=false;setH(nearest(sheet.offsetHeight));});
function syncSetup(){ const sp=$('#setup'); if(sp&&!sp.classList.contains('hide')) sp.style.bottom=(sheet.offsetHeight+14)+'px'; }
setTimeout(()=>setH(snaps()[1],false),60);
window.addEventListener('resize',()=>setH(nearest(sheet.offsetHeight),false));

/* ===== KAARTEN ===== */
const cardsEl=$('#cards');
ZONES.forEach((z,i)=>{
  const c=document.createElement('div'); c.className='card';
  c.innerHTML=`<div class="meta"><div class="num">0${i+1}</div><div class="nm">${z.name}</div><div class="ch">“${z.character}”</div></div><div class="go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h14"/><path d="M13 6l6 6-6 6"/></svg></div>`;
  c.onclick=()=>openPlace(z.id,2); cardsEl.appendChild(c);
});

/* ===== MODUS ===== */
function setMode(m){ mode=m; $('#mLive').classList.toggle('on',m==='live'); $('#mDemo').classList.toggle('on',m==='demo');
  $('#eyebrow').textContent=m==='live'?'Je staat bij':'Demo · je bezoekt';
  if(m==='live'){ hideDemoMe(); $('#maphint').classList.add('hide'); startGeo(); }
  else { stopGeo(); if(liveMe&&map){map.removeLayer(liveMe);liveMe=null;} showDemoMe(); if(!active)$('#maphint').classList.remove('hide'); }
}
$('#mLive').onclick=()=>setMode('live'); $('#mDemo').onclick=()=>setMode('demo');

/* ===== VERSCHUIFBARE LOCATIE (demo) ===== */
function showDemoMe(){
  if(!map||demoMe) return;
  demoMe=L.marker([53.2188,6.5677],{draggable:true,zIndexOffset:1000,
    icon:L.divIcon({className:'me-pin',iconSize:[30,30],iconAnchor:[15,15],html:'<span class="d"></span>'})}).addTo(map);
  demoMe.on('drag',()=>{ const p=demoMe.getLatLng(); const here=ZONES.find(z=>inPoly(p.lat,p.lng,z.polygon));
    if(here){ if(here.id!==demoZone){ demoZone=here.id; openPlace(here.id,1); } }
    else { demoZone=null; } });
}
function hideDemoMe(){ if(demoMe&&map){map.removeLayer(demoMe);demoMe=null;} demoZone=null; }

/* ===== OPENEN / SLUITEN ===== */
function openPlace(id,snapIdx){ const z=ZONES.find(x=>x.id===id); if(!z)return; active=id;
  $('#maphint').classList.add('hide');
  $('#sName').textContent=z.name; $('#sChar').textContent='\u201C'+z.character+'\u201D';
  $('#input').placeholder='Of typ je vraag aan '+z.name+'\u2026';
  const sg=$('#sugs'); sg.innerHTML=''; z.sugs.forEach(s=>{const b=document.createElement('div');b.className='sug';b.textContent=s;b.onclick=()=>{$('#input').value=s;sendMsg();};sg.appendChild(b);});
  renderConvo(z); if(histories[id].length===0) pushThem(z,z.fallback[0]); mountVoice(z);
  if(map&&z._center) map.panTo(z._center,{animate:true});
  sheet.classList.add('detail'); setH(snaps()[snapIdx||2]); }
function closePlace(){ active=null; sheet.classList.remove('detail'); clearWidget(); setH(snaps()[1]);
  if(mode==='demo'){ demoZone=null; $('#maphint').classList.remove('hide'); } }
$('#back').onclick=closePlace;

/* ===== STEM / PREVIEW ===== */
function clearWidget(){ $('#widgetMount').innerHTML=''; }
function mountVoice(z){ clearWidget(); const aid=ELEVENLABS_AGENT_IDS[z.id];
  if(aid){ const w=document.createElement('elevenlabs-convai'); w.setAttribute('agent-id',aid); $('#widgetMount').appendChild(w); $('#talkLabel').textContent='Stem actief · tik op de ElevenLabs-knop'; }
  else $('#talkLabel').textContent='Preview · typ of tik een vraag'; }

/* ===== GESPREK ===== */
function renderConvo(z){ const c=$('#convo'); c.innerHTML=''; histories[z.id].forEach(m=>addBubble(m.role==='assistant'?'them':'me',m.content)); c.scrollTop=c.scrollHeight; }
function addBubble(side,t){ const c=$('#convo'); const el=document.createElement('div'); el.className='msg '+side; el.textContent=t; c.appendChild(el); c.scrollTop=c.scrollHeight; }
function pushThem(z,t){ histories[z.id].push({role:'assistant',content:t}); addBubble('them',t); }
function showTyping(){ const c=$('#convo'); const t=document.createElement('div'); t.className='typing';t.id='typing'; t.innerHTML='<i></i><i></i><i></i>'; c.appendChild(t); c.scrollTop=c.scrollHeight; }
function hideTyping(){ const t=$('#typing'); if(t)t.remove(); }
$('#talk').onclick=()=>$('#input').focus();
async function sendMsg(){ if(!active)return; const z=ZONES.find(x=>x.id===active); const text=$('#input').value.trim(); if(!text)return;
  $('#input').value=''; $('#input').style.height='auto'; histories[z.id].push({role:'user',content:text}); addBubble('me',text);
  showTyping(); $('#send').disabled=true; $('#talk').classList.add('speaking');
  let reply; try{ reply=await askAgent(z);}catch(e){ reply=z.fallback[Math.floor(Math.random()*z.fallback.length)]; }
  hideTyping(); $('#talk').classList.remove('speaking'); histories[z.id].push({role:'assistant',content:reply}); addBubble('them',reply); $('#send').disabled=false; }
$('#send').onclick=sendMsg;
$('#input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();}});
$('#input').addEventListener('input',e=>{e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,90)+'px';});
async function askAgent(z){ const system=z.persona+`\n\nREGELS: Antwoord ALTIJD in het Nederlands, in karakter, kort (2-4 zinnen). Echte info over Groningen waar het kan; verzin geen onzekere feiten. Soms een wedervraag.`;
  const msgs=histories[z.id].slice(-10).map(m=>({role:m.role,content:m.content}));
  const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,system,messages:msgs})});
  const data=await res.json(); const out=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join(' ').trim(); if(!out)throw new Error('leeg'); return out; }

/* ===== GEOFENCE ===== */
function inPoly(lat,lng,poly){ let inside=false; for(let i=0,j=poly.length-1;i<poly.length;j=i++){ const yi=poly[i][0],xi=poly[i][1],yj=poly[j][0],xj=poly[j][1]; if(((yi>lat)!==(yj>lat))&&(lng<(xj-xi)*(lat-yi)/(yj-yi)+xi)) inside=!inside; } return inside; }
function startGeo(){ if(!navigator.geolocation)return; watch=navigator.geolocation.watchPosition(pos=>{ const {latitude:la,longitude:lo}=pos.coords;
  if(map){ if(!liveMe) liveMe=L.marker([la,lo],{icon:L.divIcon({className:'me-pin',iconSize:[30,30],iconAnchor:[15,15],html:'<span class="d"></span>'})}).addTo(map); else liveMe.setLatLng([la,lo]); }
  const here=ZONES.find(z=>inPoly(la,lo,z.polygon)); if(here&&active!==here.id) openPlace(here.id,1); },()=>{},{enableHighAccuracy:true,maximumAge:4000}); }
function stopGeo(){ if(watch!=null){ navigator.geolocation.clearWatch(watch); watch=null; } }

/* ===== INIT ===== */
$('#setupX').onclick=()=>$('#setup').classList.add('hide');
if(Object.values(ELEVENLABS_AGENT_IDS).every(v=>v)) $('#setup').classList.add('hide');
setMode('demo');
</script>
</body>
</html>
