<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Stadsstemmen · Groningen</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script type="module">
  // ElevenLabs voice SDK — eigen interface, geen pop-up widget
  try {
    const m = await import("https://esm.sh/@elevenlabs/client@1.9.0");
    window.ElevenLabsConversation = m.Conversation;
  } catch (e) { console.warn("ElevenLabs SDK kon niet laden:", e); }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;600;700;800;900&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#e9eae5; --ink:#14150f; --ink-2:#4a4c44; --muted:#76786e;
    --line:rgba(20,21,15,.12);
    --surface:rgba(255,255,255,.74); --surface-solid:#fbfbf8; --glass-brd:rgba(255,255,255,.7);
    --lime:#c8f23c; --lime-l:#e6ff86; --lime-d:#9fce1c; --blue:#5db8ff;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{font-family:'Hanken Grotesk',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden;background:var(--bg);}

  .stage{height:100%;display:flex;align-items:center;justify-content:center;}
  .app{position:relative;width:100%;max-width:440px;height:100%;max-height:940px;overflow:hidden;background:var(--bg);}
  @media(min-width:480px){.stage{padding:22px;}.app{border-radius:36px;box-shadow:0 40px 120px rgba(0,0,0,.35);}}

  /* ===== KAART ===== */
  #map{position:absolute;inset:0;z-index:1;background:#e9eae5;}
  .leaflet-container{background:#e9eae5;font-family:inherit;}
  .leaflet-tile{filter:grayscale(.35) brightness(1.04) contrast(.96);}
  .leaflet-div-icon{background:transparent;border:none;}
  .place-pin{width:0;height:0;}
  .place-pin .ppin{position:absolute;left:0;top:0;transform:translate(-50%,-50%);width:50px;height:50px;border-radius:50%;box-sizing:border-box;
    background:linear-gradient(135deg,var(--lime-l),var(--lime) 55%,var(--lime-d));padding:3px;box-shadow:0 4px 12px rgba(0,0,0,.3);transition:box-shadow .25s,transform .25s;}
  .place-pin .ppin img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:2px solid #fff;box-sizing:border-box;display:block;background:#cfd3c2;}
  .place-pin .pulse{position:absolute;left:0;top:0;width:50px;height:50px;border-radius:50%;background:var(--lime);opacity:0;}
  .place-pin.active .pulse{opacity:.5;animation:ppulse 2.1s ease-out infinite;}
  .place-pin.active .ppin{box-shadow:0 4px 18px rgba(167,211,31,.75);transform:translate(-50%,-50%) scale(1.08);}
  @keyframes ppulse{0%{transform:translate(-50%,-50%) scale(1);opacity:.45;}100%{transform:translate(-50%,-50%) scale(1.95);opacity:0;}}
  .me-pin .d{display:block;width:30px;height:30px;border-radius:50%;background:#fff;border:3px solid var(--ink);
    box-shadow:0 5px 14px rgba(0,0,0,.32);box-sizing:border-box;position:relative;cursor:grab;}
  .me-pin .d::after{content:'';position:absolute;inset:6px;border-radius:50%;background:var(--blue);}
  .me-pin .d:active{cursor:grabbing;}
  .leaflet-tooltip.lm-tip{background:var(--ink);border:none;box-shadow:0 3px 10px rgba(0,0,0,.25);color:#fff;
    font-family:'Hanken Grotesk';font-size:11px;font-weight:700;padding:4px 9px;border-radius:8px;}
  .leaflet-tooltip.lm-tip::before{display:none;}

  /* ===== TOP BAR (basic) ===== */
  .top{position:absolute;z-index:6;top:0;left:0;right:0;padding:16px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .chip{display:flex;align-items:center;gap:9px;padding:10px 15px;border-radius:14px;background:var(--surface);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--glass-brd);box-shadow:0 6px 20px rgba(0,0,0,.10);}
  .chip .dotmk{width:9px;height:9px;border-radius:50%;background:var(--lime);border:1.5px solid var(--ink);flex-shrink:0;}
  .chip .mk{font-family:'Schibsted Grotesk';font-weight:800;font-size:16px;letter-spacing:-.02em;}
  .seg{display:flex;gap:3px;padding:3px;border-radius:13px;background:var(--surface);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border:1px solid var(--glass-brd);box-shadow:0 6px 18px rgba(0,0,0,.10);}
  .seg button{border:none;background:transparent;color:var(--muted);font-family:inherit;font-weight:800;font-size:10px;
    letter-spacing:.08em;text-transform:uppercase;padding:9px 13px;border-radius:10px;cursor:pointer;transition:.16s;}
  .seg button.on{background:var(--ink);color:var(--lime);}

  /* demo-hint op de kaart */
  .maphint{position:absolute;z-index:5;top:74px;left:50%;transform:translateX(-50%);
    display:flex;align-items:center;gap:8px;padding:9px 15px;border-radius:999px;background:var(--surface);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--glass-brd);
    box-shadow:0 6px 18px rgba(0,0,0,.10);font-size:12px;font-weight:600;color:var(--ink-2);white-space:nowrap;transition:.3s;}
  .maphint.hide{opacity:0;transform:translate(-50%,-8px);pointer-events:none;}
  .maphint .b{width:13px;height:13px;border-radius:50%;background:#fff;border:2px solid var(--ink);position:relative;}
  .maphint .b::after{content:'';position:absolute;inset:2.5px;border-radius:50%;background:var(--blue);}

  /* ===== ZWEVENDE SPRAAKKNOP ===== */
  .voice-fab{position:absolute;z-index:7;top:70px;right:16px;width:56px;height:56px;border-radius:50%;
    display:none;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);
    background:linear-gradient(135deg,var(--lime-l),var(--lime) 55%,var(--lime-d));
    border:1px solid rgba(20,21,15,.16);
    box-shadow:0 10px 26px rgba(159,206,28,.55),0 2px 8px rgba(0,0,0,.18);}
  .voice-fab.show{display:flex;animation:vfin .28s ease both;}
  @keyframes vfin{from{opacity:0;transform:scale(.55) translateY(-6px);}to{opacity:1;transform:none;}}
  .voice-fab::before{content:'';position:absolute;inset:-3px;border-radius:50%;border:2px solid var(--lime);opacity:.6;animation:vfring 1.9s ease-out infinite;pointer-events:none;}
  @keyframes vfring{0%{transform:scale(1);opacity:.55;}100%{transform:scale(1.55);opacity:0;}}
  .voice-fab .vf-ico{display:flex;}
  .voice-fab .vf-ico svg{width:25px;height:25px;}
  .voice-fab .vf-wave{display:none;gap:3px;align-items:center;height:22px;}
  .voice-fab.speaking .vf-wave{display:flex;}
  .voice-fab.speaking .vf-ico{display:none;}
  .voice-fab .vf-wave i{width:3.5px;height:8px;background:var(--ink);border-radius:3px;animation:vfbar .75s ease-in-out infinite;}
  .voice-fab .vf-wave i:nth-child(2){animation-delay:.14s;}
  .voice-fab .vf-wave i:nth-child(3){animation-delay:.28s;}
  .voice-fab .vf-wave i:nth-child(4){animation-delay:.42s;}
  @keyframes vfbar{0%,100%{height:7px;}50%{height:20px;}}

  /* ===== SLIDE-PANEEL ===== */
  .sheet{position:absolute;z-index:8;left:0;right:0;bottom:0;height:55%;
    background:var(--surface);backdrop-filter:blur(30px) saturate(1.4);-webkit-backdrop-filter:blur(30px) saturate(1.4);
    border-top:1px solid var(--glass-brd);border-radius:30px 30px 0 0;
    box-shadow:0 -18px 50px rgba(0,0,0,.18), 0 -1px 0 rgba(255,255,255,.8) inset;display:flex;flex-direction:column;overflow:hidden;}
  .drag{flex-shrink:0;cursor:grab;touch-action:none;padding:18px 0 16px;}
  .drag:active{cursor:grabbing;}
  .grip{width:48px;height:6px;border-radius:9px;background:rgba(20,21,15,.22);margin:0 auto;}

  /* lijst */
  .list-view{display:flex;flex-direction:column;flex:1;min-height:0;}
  .list-head{padding:8px 24px 16px;cursor:grab;touch-action:none;}
  .list-head:active{cursor:grabbing;}
  .list-head .eb{font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--muted);}
  .list-head .ttl{font-family:'Schibsted Grotesk';font-weight:800;font-size:28px;letter-spacing:-.03em;line-height:1.04;margin-top:5px;}
  .cards{flex:1;overflow-y:auto;padding:2px 16px 24px;display:flex;flex-direction:column;gap:11px;}
  .cards::-webkit-scrollbar{width:6px;}.cards::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px;}
  .card{display:flex;align-items:center;gap:16px;padding:16px 16px 16px 20px;border-radius:18px;cursor:pointer;
    background:var(--surface-solid);border:1px solid var(--line);transition:.16s;box-shadow:0 2px 8px rgba(0,0,0,.04);}
  .card:hover{box-shadow:0 8px 22px rgba(0,0,0,.10);transform:translateY(-1px);}
  .card:active{transform:scale(.99);}
  .card .meta{flex:1;min-width:0;}
  .card .num{font-family:'Schibsted Grotesk';font-weight:700;font-size:11px;color:var(--muted);letter-spacing:.06em;}
  .card .nm{font-family:'Schibsted Grotesk';font-weight:800;font-size:18px;letter-spacing:-.02em;line-height:1.1;margin-top:3px;}
  .card .ch{font-size:12.5px;color:var(--muted);margin-top:3px;}
  .card .go{width:46px;height:46px;border-radius:50%;background:var(--ink);color:var(--lime);flex-shrink:0;display:grid;place-items:center;font-size:19px;}

  /* gesprek */
  .info-view{flex:1;display:none;flex-direction:column;min-height:0;}
  .sheet.info .list-view{display:none;}
  .sheet.info .info-view{display:flex;}
  .info-body{flex:1;overflow-y:auto;padding:18px 24px 8px;}
  .info-desc{font-size:15px;line-height:1.6;color:var(--ink-2);}
  .info-foot{padding:12px 18px calc(18px + env(safe-area-inset-bottom));}
  .talk-cta{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:16px;border-radius:16px;
    border:none;cursor:pointer;font-family:'Schibsted Grotesk';font-weight:800;font-size:15px;letter-spacing:-.01em;background:var(--ink);color:var(--lime);}
  .talk-cta svg{width:20px;height:20px;}
  .talk-cta.off{background:var(--surface-solid);color:var(--muted);border:1px solid var(--line);cursor:default;}
  .convo-view{flex:1;display:none;flex-direction:column;min-height:0;}
  .sheet.detail .list-view{display:none;}
  .sheet.detail .info-view{display:none;}
  .sheet.detail .convo-view{display:flex;}
  .cv-head{padding:4px 20px 0;display:flex;align-items:center;gap:14px;}
  .back{width:44px;height:44px;border-radius:50%;background:var(--ink);color:var(--lime);border:none;font-size:19px;cursor:pointer;display:grid;place-items:center;flex-shrink:0;}
  .cv-title{min-width:0;}
  .cv-title .eyebrow{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);}
  .cv-title .nm{font-family:'Schibsted Grotesk';font-weight:800;font-size:22px;letter-spacing:-.03em;line-height:1.05;margin-top:3px;}
  .cv-title .ch{font-size:12.5px;color:var(--ink-2);font-weight:600;margin-top:3px;}

  /* media / slideshow — overlay die over de transcriptie schuift */
  .cv-body{position:relative;flex:1;min-height:0;overflow:hidden;}
  .media{position:absolute;top:8px;left:20px;right:20px;height:52%;border-radius:18px;overflow:hidden;background:#e9eadf;z-index:3;
    box-shadow:0 14px 32px rgba(0,0,0,.3);transition:transform .4s cubic-bezier(.22,1,.36,1),box-shadow .25s;}
  .media.up{transform:translateY(calc(-100% + 62px));box-shadow:0 6px 16px rgba(0,0,0,.18);}
  .media.speaking{box-shadow:0 0 0 3px var(--lime),0 14px 32px rgba(167,211,31,.45);}
  .media .slides{position:absolute;inset:0;}
  .media .slides img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .9s ease;}
  .media .slides img.on{opacity:1;}
  .mdots{position:absolute;left:0;right:0;bottom:38px;display:flex;gap:6px;justify-content:center;z-index:2;}
  .mdots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.6);transition:.25s;cursor:pointer;}
  .mdots i.on{background:#fff;width:18px;border-radius:3px;}
  .media.up .mdots{display:none;}
  .mhandle{position:absolute;left:0;right:0;bottom:0;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;
    background:linear-gradient(to top,rgba(20,21,15,.6),rgba(20,21,15,0));color:#fff;}
  .mhandle .grip{width:36px;height:4px;border-radius:3px;background:rgba(255,255,255,.92);}
  .mchev{width:15px;height:15px;position:absolute;right:12px;transition:transform .3s;opacity:.9;}
  .media:not(.up) .mchev{transform:rotate(180deg);}

  /* compacte mic-knop met gele gradient */
  .cstatus{font-size:11.5px;color:var(--muted);font-weight:600;padding:7px 20px 0;min-height:14px;}
  .micbtn{width:46px;height:46px;border-radius:50%;border:1px solid rgba(20,21,15,.16);cursor:pointer;flex-shrink:0;position:relative;
    display:grid;place-items:center;color:var(--ink);background:linear-gradient(135deg,var(--lime-l),var(--lime) 55%,var(--lime-d));
    box-shadow:0 4px 14px rgba(159,206,28,.5);}
  .micbtn:active{transform:scale(.95);}
  .micbtn .m-ico{display:flex;}
  .micbtn .m-ico svg{width:22px;height:22px;}
  .micbtn .m-wave{display:none;gap:3px;align-items:center;height:20px;}
  .micbtn.speaking .m-wave{display:flex;}
  .micbtn.speaking .m-ico{display:none;}
  .micbtn .m-wave i{width:3px;height:7px;background:var(--ink);border-radius:2px;animation:vfbar .75s ease-in-out infinite;}
  .micbtn .m-wave i:nth-child(2){animation-delay:.14s;} .micbtn .m-wave i:nth-child(3){animation-delay:.28s;}
  .micbtn.connecting{animation:micpulse 1s ease-in-out infinite;}
  .micbtn.off{background:var(--surface-solid);color:var(--muted);box-shadow:none;border-color:var(--line);cursor:default;}
  .micbtn.off::after{display:none;}
  .micbtn.live::after{content:'';position:absolute;inset:-3px;border-radius:50%;border:2px solid var(--lime);opacity:.6;animation:vfring 1.9s ease-out infinite;pointer-events:none;}
  @keyframes micpulse{0%,100%{box-shadow:0 4px 14px rgba(159,206,28,.5);}50%{box-shadow:0 4px 22px rgba(159,206,28,.95);}}

  .convo{position:absolute;inset:0;overflow-y:auto;padding:74px 20px 6px;display:flex;flex-direction:column;gap:11px;}
  .convo::-webkit-scrollbar{width:6px;}.convo::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px;}
  .msg{max-width:84%;padding:12px 16px;border-radius:17px;line-height:1.5;font-size:14.5px;animation:rise .3s ease both;}
  @keyframes rise{from{opacity:0;transform:translateY(7px);}to{opacity:1;transform:none;}}
  .msg.them{align-self:flex-start;background:var(--surface-solid);border:1px solid var(--line);border-top-left-radius:5px;font-family:'Schibsted Grotesk';font-weight:600;}
  .msg.me{align-self:flex-end;background:var(--lime);color:var(--ink);border-top-right-radius:5px;font-weight:700;}
  .typing{align-self:flex-start;display:flex;gap:5px;padding:14px 16px;}
  .typing i{width:7px;height:7px;border-radius:50%;background:var(--lime-d);animation:bl 1.1s infinite;}
  .typing i:nth-child(2){animation-delay:.18s;}.typing i:nth-child(3){animation-delay:.36s;}
  @keyframes bl{0%,100%{opacity:.3;transform:translateY(0);}50%{opacity:1;transform:translateY(-3px);}}

  .sugs{display:flex;gap:9px;overflow-x:auto;padding:10px 18px;scrollbar-width:none;}
  .sugs::-webkit-scrollbar{display:none;}
  .sug{flex-shrink:0;font-size:12.5px;font-weight:700;padding:9px 15px;border-radius:999px;background:var(--surface-solid);
    border:1px solid var(--line);color:var(--ink-2);cursor:pointer;white-space:nowrap;transition:.15s;}
  .sug:hover{border-color:var(--ink);color:var(--ink);}
  .composer{display:flex;gap:10px;padding:6px 18px calc(16px + env(safe-area-inset-bottom));align-items:center;}
  .field{flex:1;display:flex;align-items:center;background:var(--surface-solid);border:1px solid var(--line);border-radius:15px;padding:3px 4px 3px 17px;}
  .field:focus-within{border-color:var(--ink);}
  .field textarea{flex:1;background:none;border:none;outline:none;color:var(--ink);font-family:inherit;font-size:14.5px;resize:none;padding:12px 0;max-height:90px;line-height:1.35;}
  .field textarea::placeholder{color:var(--muted);}
  .send{width:44px;height:44px;border:none;border-radius:13px;cursor:pointer;flex-shrink:0;background:var(--ink);color:var(--lime);font-size:18px;display:grid;place-items:center;}
  .send:disabled{opacity:.4;}
  .go svg,.back svg{width:21px;height:21px;}
  .send svg{width:19px;height:19px;}

  .setup{position:absolute;z-index:7;bottom:calc(55% + 14px);left:14px;right:14px;padding:12px 15px;border-radius:14px;
    background:var(--surface);backdrop-filter:blur(16px);border:1px solid var(--glass-brd);box-shadow:0 8px 24px rgba(0,0,0,.10);
    font-size:11.5px;line-height:1.45;color:var(--ink-2);display:flex;gap:10px;align-items:flex-start;transition:.3s;}
  .setup b{color:var(--ink);}
  .setup .x{margin-left:auto;background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;flex-shrink:0;}
  .setup.hide{display:none;}
</style>
</head>
<body>
<div class="stage">
  <div class="app" id="app">
    <div id="map"></div>

    <div class="top">
      <div class="chip"><span class="mk">Stads<b>stemmen</b></span></div>
      <div class="seg"><button id="mDemo" class="on">Demo</button><button id="mLive">Live</button></div>
    </div>

    <div class="maphint" id="maphint"><span class="b"></span>Sleep je locatie over een plek</div>

    <button class="voice-fab" id="voiceFab" aria-label="Terug naar gesprek">
      <span class="vf-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 19v3"/></svg></span>
      <span class="vf-wave"><i></i><i></i><i></i><i></i></span>
    </button>

    <div class="setup" id="setup">
      <span>🎙️</span>
      <span><b>Preview.</b> Nog geen ElevenLabs agent-id's — plekken antwoorden als tekst. Vul de id's bovenin het bestand in voor de echte stemmen.</span>
      <button class="x" id="setupX">×</button>
    </div>

    <!-- SLEEPBAAR PANEEL -->
    <div class="sheet" id="sheet">
      <div class="drag" id="drag"><div class="grip"></div></div>

      <div class="list-view">
        <div class="list-head"><div class="eb">5 stemmen · binnenstad</div><div class="ttl">Plekken in de buurt</div></div>
        <div class="cards" id="cards"></div>
      </div>

      <div class="info-view">
        <div class="cv-head">
          <button class="back" id="backInfo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12H6"/><path d="M11 6l-6 6 6 6"/></svg></button>
          <div class="cv-title"><div class="eyebrow" id="iEyebrow">Plek</div><div class="nm" id="iName">—</div><div class="ch" id="iChar"></div></div>
        </div>
        <div class="info-body"><p class="info-desc" id="iDesc"></p></div>
        <div class="info-foot" id="iFoot"></div>
      </div>

      <div class="convo-view">
        <div class="cv-head">
          <button class="back" id="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12H6"/><path d="M11 6l-6 6 6 6"/></svg></button>
          <div class="cv-title"><div class="eyebrow" id="eyebrow">Demo · je bezoekt</div><div class="nm" id="sName">—</div><div class="ch" id="sChar"></div></div>
        </div>
        <div class="cv-body">
          <div class="convo" id="convo"></div>
          <div class="media up" id="media">
            <div class="slides" id="slides"></div>
            <div class="mdots" id="mdots"></div>
            <div class="mhandle" id="mhandle"><span class="grip"></span><svg class="mchev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></div>
          </div>
        </div>
        <div class="sugs" id="sugs"></div>
        <div class="cstatus" id="talkLabel">Tik om te praten</div>
        <div class="composer">
          <button class="micbtn" id="talk" aria-label="Praten">
            <span class="m-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 19v3"/></svg></span>
            <span class="m-wave"><i></i><i></i><i></i></span>
          </button>
          <div class="field"><textarea id="input" rows="1" placeholder="Typ je vraag…"></textarea></div>

</div>

<script>

const INFO_TEXT = {
  martini:"97 meter hoog en ruim vijf eeuwen oud — het oudste oog van de stad, met de Martinikerk en het beroemde Schnitger-orgel aan z'n voet.",
  provinciehuis:"Eeuwenoude zetel van het provinciaal bestuur aan het Martinikerkhof, met de historische Statenzaal.",
  stadhuis:"Het neoclassicistische stadhuis op de Grote Markt — hart van het stadsbestuur, en getuige van de verwoesting in 1945.",
  forum:"Het futuristische cultuurgebouw uit 2019: bibliotheek, bioscoop en het beste dakuitzicht van Groningen.",
  vismarkt:"Eeuwenlang het handelsplein van de stad — vis, graan en de Korenbeurs, met zicht op de A-kerk."
};

const $=s=>document.querySelector(s);
let active=null, mode='demo', watch=null, liveMe=null, demoMe=null, demoZone=null, livePos=null, canTalk=false;
const histories={}; ZONES.forEach(z=>histories[z.id]=[]);
const markersById={};
function setActiveMarker(id){ for(const k in markersById){ const el=markersById[k].getElement&&markersById[k].getElement(); if(el) el.classList.toggle('active', k===id); } }

/* ===== KAART ===== */
let map=null, bounds=[];
try{
  map=L.map('map',{zoomControl:false,attributionControl:false}).setView([53.2185,6.5662],16);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{subdomains:'abcd',maxZoom:20}).addTo(map);
  const path=[];
  ZONES.forEach(z=>{
    const poly=L.polygon(z.polygon); // onzichtbaar: alleen voor geofence + midden
    const ctr=poly.getBounds().getCenter(); path.push(ctr);
    const m=L.marker(ctr,{icon:L.divIcon({className:'place-pin',iconSize:[0,0],iconAnchor:[0,0],html:'<span class="pulse"></span><span class="ppin"><img src="'+(z.pin||'')+'" alt="" onerror="this.style.display=\'none\'"></span>'})}).addTo(map);
    m.bindTooltip(z.name,{direction:'top',className:'lm-tip',offset:[0,-28]});

    markersById[z.id]=m;
    z._center=ctr; z.polygon.forEach(p=>bounds.push(p));
  });
  // (geen routelijn)
  const fit=()=>{try{map.invalidateSize();if(bounds.length)map.fitBounds(bounds,{paddingTopLeft:[60,110],paddingBottomRight:[60,380]});}catch(e){}};
  fit(); setTimeout(fit,300); window.addEventListener('load',()=>setTimeout(fit,200));
  window.addEventListener('resize',()=>{try{map.invalidateSize();}catch(e){}});
}catch(e){}

/* ===== SLIDE ===== */
const sheet=$('#sheet'), dragEl=$('#drag');
const appH=()=>sheet.parentElement.clientHeight;
function downH(){ const dr=document.querySelector('.drag'), lh=document.querySelector('.list-head');
  if(lh && lh.offsetHeight>0) return (dr?dr.offsetHeight:38) + lh.offsetHeight;
  return Math.round(0.18*appH()); }
const snaps=()=>[downH(), Math.round(0.92*appH())];
function nearest(h){return snaps().reduce((a,b)=>Math.abs(b-h)<Math.abs(a-h)?b:a);}
function setH(h,anim=true){ sheet.style.transition=anim?'height .4s cubic-bezier(.22,1,.36,1)':'none'; sheet.style.height=h+'px'; syncSetup(); updateVoiceFab(); }
let dragging=false,sy=0,sh=0;
function startDrag(e){dragging=true;sy=e.clientY;sh=sheet.offsetHeight;sheet.style.transition='none';try{e.currentTarget.setPointerCapture(e.pointerId);}catch(_){}}
dragEl.addEventListener('pointerdown',startDrag);
document.querySelector('.list-head').addEventListener('pointerdown',startDrag);
window.addEventListener('pointermove',e=>{if(!dragging)return;const s=snaps();let h=sh+(sy-e.clientY);h=Math.max(s[0]*0.6,Math.min(s[s.length-1],h));sheet.style.height=h+'px';syncSetup();});
window.addEventListener('pointerup',()=>{if(!dragging)return;dragging=false;setH(nearest(sheet.offsetHeight));});
function syncSetup(){ const sp=$('#setup'); if(sp&&!sp.classList.contains('hide')) sp.style.bottom=(sheet.offsetHeight+14)+'px'; }
setTimeout(()=>setH(snaps()[0],false),60);
window.addEventListener('resize',()=>setH(nearest(sheet.offsetHeight),false));
if(map) map.on('click',()=>{ if(!sheet.classList.contains('detail') && !sheet.classList.contains('info')) setH(snaps()[0]); });

/* ===== ZWEVENDE SPRAAKKNOP ===== */
const voiceFab=$('#voiceFab');
function updateVoiceFab(){ if(!voiceFab) return;
  const live=!!(elSession||elConnecting);
  const detail=sheet.classList.contains('detail');
  const atUp=sheet.offsetHeight > snaps()[1]-60;
  voiceFab.classList.toggle('show', live && !(detail && atUp)); }
function showConvoPanel(){ if(!active) return; const z=ZONES.find(x=>x.id===active);
  sheet.classList.remove('info'); sheet.classList.add('detail');
  if(map&&z&&z._center) map.panTo(z._center,{animate:true}); setH(snaps()[1]); }
function minimizeConvo(){ sheet.classList.remove('detail'); sheet.classList.remove('info'); setH(snaps()[0]); updateVoiceFab(); }
voiceFab.onclick=showConvoPanel;

/* ===== KAARTEN ===== */
const cardsEl=$('#cards');
ZONES.forEach((z,i)=>{
  const c=document.createElement('div'); c.className='card';
  c.innerHTML=`<div class="meta"><div class="num">0${i+1}</div><div class="nm">${z.name}</div><div class="ch">“${z.character}”</div></div><div class="go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h14"/><path d="M13 6l6 6-6 6"/></svg></div>`;
  c.onclick=()=>openPlace(z.id); cardsEl.appendChild(c);
});

/* ===== MODUS ===== */
function setMode(m){ mode=m; $('#mLive').classList.toggle('on',m==='live'); $('#mDemo').classList.toggle('on',m==='demo');
  $('#eyebrow').textContent=m==='live'?'Je staat bij':'Demo · je bezoekt';
  if(m==='live'){ hideDemoMe(); $('#maphint').classList.add('hide'); primeMic(); startGeo(); }
  else { stopGeo(); if(liveMe&&map){map.removeLayer(liveMe);liveMe=null;} showDemoMe(); if(!active)$('#maphint').classList.remove('hide'); }
}
$('#mLive').onclick=()=>setMode('live'); $('#mDemo').onclick=()=>setMode('demo');

/* ===== VERSCHUIFBARE LOCATIE (demo) ===== */
function showDemoMe(){
  if(!map||demoMe) return;
  demoMe=L.marker([53.2188,6.5677],{draggable:true,zIndexOffset:1000,
    icon:L.divIcon({className:'me-pin',iconSize:[30,30],iconAnchor:[15,15],html:'<span class="d"></span>'})}).addTo(map);
  demoMe.on('dragend',()=>{ const p=demoMe.getLatLng(); const here=ZONES.find(z=>inPoly(p.lat,p.lng,z.polygon)); if(here){ openConvo(here.id); } else if(active){ closeToList(); } });
}
function hideDemoMe(){ if(demoMe&&map){map.removeLayer(demoMe);demoMe=null;} demoZone=null; }

/* ===== OPENEN / SLUITEN ===== */
const MIC='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 19v3"/></svg>';
function openPlace(id){ const z=ZONES.find(x=>x.id===id); if(!z) return;
  if(id===active && (elSession||elConnecting)){ showConvoPanel(); return; }
  openConvo(id); }
function openInfo(id){ const z=ZONES.find(x=>x.id===id); if(!z)return; active=id;
  $('#maphint').classList.add('hide');
  $('#iEyebrow').textContent = mode==='live'?'Je staat bij':'Demo · je bezoekt';
  $('#iName').textContent=z.name; $('#iChar').textContent='\u201C'+z.character+'\u201D';
  $('#iDesc').textContent=INFO_TEXT[z.id]||'';
  renderInfoFoot(z);
  if(map&&z._center) map.panTo(z._center,{animate:true});
  sheet.classList.remove('detail'); sheet.classList.add('info'); setH(snaps()[1]); }
function renderInfoFoot(z){ const foot=$('#iFoot');
  const can=(mode==='demo')||(mode==='live'&&livePos&&inPoly(livePos.lat,livePos.lng,z.polygon));
  if(can){ foot.innerHTML='<button class="talk-cta" id="ctaTalk">'+MIC+' Praat met deze plek</button>'; $('#ctaTalk').onclick=()=>openConvo(z.id); }
  else { let txt='Kom dichterbij om te praten';
    if(mode==='live'&&livePos&&z._center){ const d=Math.round(haversine(livePos.lat,livePos.lng,z._center.lat,z._center.lng)); txt='Kom dichterbij · nog ~'+d+' m'; }
    else if(mode==='live'&&!livePos){ txt='Locatie zoeken…'; }
    foot.innerHTML='<div class="talk-cta off">'+MIC+' '+txt+'</div>'; } }
function distTxt(z){ if(mode==='live'&&livePos&&z._center){ const d=Math.round(haversine(livePos.lat,livePos.lng,z._center.lat,z._center.lng)); return 'Kom dichterbij · nog ~'+d+' m'; } if(mode==='live'&&!livePos) return 'Locatie zoeken\u2026'; return 'Kom dichterbij om te praten'; }
function openConvo(id){ const z=ZONES.find(x=>x.id===id); if(!z)return; stopVoice(); active=id;
  const aid=ELEVENLABS_AGENT_IDS[id];
  canTalk=(mode==='demo')||(!!livePos && inPoly(livePos.lat,livePos.lng,z.polygon));
  $('#sName').textContent=z.name; $('#sChar').textContent='\u201C'+z.character+'\u201D';
  $('#input').placeholder='Typ je vraag aan '+z.name+'\u2026';
  const sg=$('#sugs'); sg.innerHTML=''; z.sugs.forEach(s=>{const b=document.createElement('div');b.className='sug';b.textContent=s;b.onclick=()=>{$('#input').value=s;sendMsg();};sg.appendChild(b);});
  renderConvo(z); if(!aid && histories[id].length===0) pushThem(z,z.fallback[0]); mountVoice(z);
  buildSlides(z); setActiveMarker(id);
  if(map&&z._center) map.panTo(z._center,{animate:true});
  sheet.classList.remove('info'); sheet.classList.add('detail'); setH(snaps()[1]);
  $('#talk').classList.toggle('off', !canTalk);
  if(canTalk){ if(aid) startConversation(z); } else { setTalkLabel(distTxt(z)); } }
function closeToList(){ stopVoice(); stopSlides(); setActiveMarker(null); active=null; sheet.classList.remove('detail'); sheet.classList.remove('info'); sheet.classList.remove('voice'); setH(snaps()[0]);
  if(mode==='demo'){ $('#maphint').classList.remove('hide'); } }
$('#back').onclick=()=>{ if(elSession||elConnecting){ minimizeConvo(); } else { closeToList(); } };
$('#backInfo').onclick=closeToList;

/* ===== STEM + TEKST (één sessie — spraak en tekst door elkaar) ===== */
let elSession=null, elConnecting=false, elGen=0, lastUserText=null, lastUserAt=0, micPrimed=false;
function setTalkLabel(t){ $('#talkLabel').textContent=t; }
function mountVoice(z){ const aid=ELEVENLABS_AGENT_IDS[z.id];
  setTalkLabel(aid?'Tik om te praten':'Preview · typ of tik een vraag'); }
function addUserText(t){ addBubble('me',t); lastUserText=t; lastUserAt=Date.now(); }
async function primeMic(){ if(micPrimed) return; try{ const s=await navigator.mediaDevices.getUserMedia({audio:true}); s.getTracks().forEach(t=>t.stop()); micPrimed=true; }catch(e){ console.warn('mic vooraf niet toegestaan',e); } }
function sendUserText(text){ if(!elSession) return; try{ if(elSession.sendUserActivity) elSession.sendUserActivity(); elSession.sendUserMessage(text); addUserText(text); }catch(e){ console.error(e); } }
async function startConversation(z, initialMessage){
  if(elConnecting) return;
  if(elSession){ if(initialMessage) sendUserText(initialMessage); return; }
  const aid=ELEVENLABS_AGENT_IDS[z.id]; if(!aid) return;
  const Conv=window.ElevenLabsConversation;
  if(!Conv){ setTalkLabel('Stem niet beschikbaar \u2014 typ je vraag'); return; }
  const myGen=++elGen; elConnecting=true; setTalkLabel('Verbinden\u2026'); $('#talk').classList.add('connecting');
  if(initialMessage) addUserText(initialMessage);
  try{
    try{ await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}}); micPrimed=true; }catch(e){}
    const s=await Conv.startSession({
      agentId:aid, connectionType:'websocket',
      onConnect:()=>{ if(myGen!==elGen) return; elConnecting=false; const t=$('#talk'); t.classList.remove('connecting'); t.classList.add('live'); setTalkLabel('Aan het luisteren\u2026 (tik om te stoppen)'); updateVoiceFab(); if(initialMessage) setTimeout(()=>{ if(myGen===elGen && elSession){ try{elSession.sendUserMessage(initialMessage);}catch(e){} } },250); },
      onDisconnect:()=>{ if(myGen!==elGen) return; resetVoiceUI(); },
      onError:(e)=>{ if(myGen!==elGen) return; console.error('EL error',e); setTalkLabel('Verbinding mislukt'); resetVoiceUI(); },
      onModeChange:(m)=>{ if(myGen!==elGen) return; const md=(m&&m.mode)||m; const sp=md==='speaking'; $('#talk').classList.toggle('speaking',sp); if(voiceFab) voiceFab.classList.toggle('speaking',sp); { const md2=$('#media'); if(md2) md2.classList.toggle('speaking',sp); } setTalkLabel(sp?'Aan het praten\u2026':'Aan het luisteren\u2026 (tik om te stoppen)'); },
      onMessage:(p)=>{ if(myGen!==elGen) return; const t=p&&(p.message||p.text); const src=p&&(p.source||p.role); if(!t)return;
        if(src==='user'){ if(t===lastUserText && Date.now()-lastUserAt<6000){ lastUserText=null; return; } addBubble('me',t); }
        else addBubble('them',t); }
    });
    if(myGen!==elGen){ try{s.endSession();}catch(e){} return; }
    elSession=s;
  }catch(e){ if(myGen!==elGen) return; console.error(e); setTalkLabel('Geen verbinding \u2014 check agent/microfoon'); resetVoiceUI(); }
}
function stopVoice(){ elGen++; const c=elSession; elSession=null; elConnecting=false; if(c){ try{c.endSession();}catch(e){} } resetVoiceUI(); }
function resetVoiceUI(){ elSession=null; elConnecting=false; const t=$('#talk'); if(t) t.classList.remove('speaking','live','connecting'); if(voiceFab) voiceFab.classList.remove('speaking'); { const md=$('#media'); if(md) md.classList.remove('speaking'); } updateVoiceFab();
  if(active){ const z=ZONES.find(x=>x.id===active); if(z&&ELEVENLABS_AGENT_IDS[z.id]) setTalkLabel('Tik om te praten'); } }

/* ===== GESPREK ===== */
function renderConvo(z){ const c=$('#convo'); c.innerHTML=''; histories[z.id].forEach(m=>addBubble(m.role==='assistant'?'them':'me',m.content)); c.scrollTop=c.scrollHeight; }
function addBubble(side,t){ const c=$('#convo'); const el=document.createElement('div'); el.className='msg '+side; el.textContent=t; c.appendChild(el); c.scrollTop=c.scrollHeight; }

/* ===== SLIDESHOW (overlay) ===== */
let slideTimer=null, slideIdx=0, slideEls=[];
function buildSlides(z){
  const wrap=$('#slides'), dots=$('#mdots'); if(!wrap) return;
  wrap.innerHTML=''; dots.innerHTML=''; slideEls=[]; slideIdx=0;
  $('#media').classList.add('up');
  const imgs=z.photos||[];
  imgs.forEach((src,i)=>{
    const im=document.createElement('img'); im.src=src; im.alt=z.name; im.loading=i?'lazy':'eager';
    im.onerror=()=>{ im.style.display='none'; };
    if(i===0) im.classList.add('on'); wrap.appendChild(im); slideEls.push(im);
    const d=document.createElement('i'); if(i===0) d.classList.add('on'); d.onclick=(e)=>{ e.stopPropagation(); showSlide(i); restartSlideTimer(); }; dots.appendChild(d);
  });
  restartSlideTimer();
}
function showSlide(n){ if(!slideEls.length) return; slideIdx=(n+slideEls.length)%slideEls.length;
  slideEls.forEach((im,i)=>im.classList.toggle('on',i===slideIdx));
  const dots=$('#mdots').children; for(let i=0;i<dots.length;i++) dots[i].classList.toggle('on',i===slideIdx); }
function nextSlide(){ showSlide(slideIdx+1); }
function restartSlideTimer(){ stopSlides(); if(slideEls.length>1) slideTimer=setInterval(nextSlide,4500); }
function stopSlides(){ if(slideTimer){ clearInterval(slideTimer); slideTimer=null; } }
$('#mhandle').onclick=()=>{ $('#media').classList.toggle('up'); };
function pushThem(z,t){ histories[z.id].push({role:'assistant',content:t}); addBubble('them',t); }
function showTyping(){ const c=$('#convo'); const t=document.createElement('div'); t.className='typing';t.id='typing'; t.innerHTML='<i></i><i></i><i></i>'; c.appendChild(t); c.scrollTop=c.scrollHeight; }
function hideTyping(){ const t=$('#typing'); if(t)t.remove(); }
$('#talk').onclick=()=>{ if(!active) return; const z=ZONES.find(x=>x.id===active); const aid=ELEVENLABS_AGENT_IDS[z.id];
  if(!aid){ $('#input').focus(); return; }
  if(!canTalk){ setTalkLabel(distTxt(z)); return; }
  if(elConnecting) return;
  if(elSession){ stopVoice(); } else { startConversation(z); } };
async function sendMsg(){ if(!active)return; const z=ZONES.find(x=>x.id===active); const text=$('#input').value.trim(); if(!text)return;
  $('#input').value=''; $('#input').style.height='auto';
  const aid=ELEVENLABS_AGENT_IDS[z.id];
  if(aid){ if(!canTalk){ setTalkLabel(distTxt(z)); return; } if(!elSession){ startConversation(z, text); } else { sendUserText(text); } return; }
  histories[z.id].push({role:'user',content:text}); addBubble('me',text);
  showTyping(); $('#send').disabled=true; $('#talk').classList.add('speaking');
  let reply; try{ reply=await askAgent(z);}catch(e){ reply=z.fallback[Math.floor(Math.random()*z.fallback.length)]; }
  hideTyping(); $('#talk').classList.remove('speaking'); histories[z.id].push({role:'assistant',content:reply}); addBubble('them',reply); $('#send').disabled=false; }
$('#send').onclick=sendMsg;
$('#input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();}});
$('#input').addEventListener('input',e=>{e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,90)+'px'; if(elSession&&elSession.sendUserActivity){try{elSession.sendUserActivity();}catch(_){}}});
async function askAgent(z){ const system=z.persona+`\n\nREGELS: Antwoord ALTIJD in het Nederlands, in karakter, kort (2-4 zinnen). Echte info over Groningen waar het kan; verzin geen onzekere feiten. Soms een wedervraag.`;
  const msgs=histories[z.id].slice(-10).map(m=>({role:m.role,content:m.content}));
  const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,system,messages:msgs})});
  const data=await res.json(); const out=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join(' ').trim(); if(!out)throw new Error('leeg'); return out; }

/* ===== GEOFENCE ===== */
function inPoly(lat,lng,poly){ let inside=false; for(let i=0,j=poly.length-1;i<poly.length;j=i++){ const yi=poly[i][0],xi=poly[i][1],yj=poly[j][0],xj=poly[j][1]; if(((yi>lat)!==(yj>lat))&&(lng<(xj-xi)*(lat-yi)/(yj-yi)+xi)) inside=!inside; } return inside; }
function haversine(la1,lo1,la2,lo2){ const R=6371e3,t=Math.PI/180; const dLa=(la2-la1)*t,dLo=(lo2-lo1)*t; const a=Math.sin(dLa/2)**2+Math.cos(la1*t)*Math.cos(la2*t)*Math.sin(dLo/2)**2; return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a)); }
function startGeo(){ if(!navigator.geolocation)return; watch=navigator.geolocation.watchPosition(pos=>{ const {latitude:la,longitude:lo}=pos.coords; livePos={lat:la,lng:lo};
  if(map){ if(!liveMe) liveMe=L.marker([la,lo],{icon:L.divIcon({className:'me-pin',iconSize:[30,30],iconAnchor:[15,15],html:'<span class="d"></span>'})}).addTo(map); else liveMe.setLatLng([la,lo]); }
  const here=ZONES.find(z=>inPoly(la,lo,z.polygon));
  if(here && active!==here.id){ openConvo(here.id); return; }
  if(active){ const az=ZONES.find(x=>x.id===active); const insideActive = here && here.id===active;
    if(insideActive){ if(!canTalk){ canTalk=true; $('#talk').classList.remove('off'); const aid=ELEVENLABS_AGENT_IDS[active]; if(aid && !elSession && !elConnecting) startConversation(az); } }
    else { if(canTalk){ canTalk=false; $('#talk').classList.add('off'); } if(elSession||elConnecting) stopVoice(); if(az && !elSession && !elConnecting) setTalkLabel(distTxt(az)); }
  } },()=>{},{enableHighAccuracy:true,maximumAge:4000}); }
function stopGeo(){ if(watch!=null){ navigator.geolocation.clearWatch(watch); watch=null; } }

/* ===== INIT ===== */
$('#setupX').onclick=()=>$('#setup').classList.add('hide');
if(Object.values(ELEVENLABS_AGENT_IDS).every(v=>v)) $('#setup').classList.add('hide');
setMode('demo');
