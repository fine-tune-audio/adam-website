<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Stadsstemmen · Groningen</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<!-- ElevenLabs Conversational AI widget (wordt gebruikt zodra er agent-id's zijn) -->
<script src="https://unpkg.com/@elevenlabs/convai-widget-embed" async type="text/javascript"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#0a0807;
    --bg2:#100d0b;
    --ink:#f8f3ea;
    --muted:rgba(248,243,234,.56);
    --faint:rgba(248,243,234,.34);
    --line:rgba(248,243,234,.10);
    --glass:rgba(26,21,17,.62);
    --glass-2:rgba(34,28,22,.74);
    --glass-brd:rgba(255,255,255,.12);
    /* signatuur: warme gloed */
    --w1:#FFC061;--w2:#FF7A3D;--w3:#E8431F;
    --acc:#FF7A3D;
    /* actieve plek-kleur (in JS gezet) */
    --c:#FF8A3D;--c-glow:rgba(255,138,61,.5);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    font-family:'Hanken Grotesk',sans-serif;background:var(--bg);color:var(--ink);
    -webkit-font-smoothing:antialiased;overflow:hidden;
    /* stage achter de app */
    background:
      radial-gradient(1100px 700px at 80% -10%, rgba(255,122,61,.10), transparent 60%),
      radial-gradient(900px 700px at 0% 110%, rgba(232,67,31,.08), transparent 55%),
      #0a0807;
  }

  /* ===== STAGE + APP FRAME ===== */
  .stage{height:100%;display:flex;align-items:center;justify-content:center;padding:0;}
  .app{
    position:relative;width:100%;max-width:440px;height:100%;max-height:940px;
    overflow:hidden;background:var(--bg2);
  }
  @media(min-width:480px){
    .stage{padding:22px;}
    .app{height:calc(100% - 0px);border-radius:34px;border:1px solid var(--line);
      box-shadow:0 40px 120px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.03) inset;}
  }

  /* ===== MAP ===== */
  #map{position:absolute;inset:0;z-index:1;background:#0d0a08;}
  .leaflet-container{background:#0d0a08;font-family:inherit;}
  /* de kaart warm + donker tinten — "vormgegeven" */
  .leaflet-tile{
    filter:brightness(.82) contrast(1.06) saturate(.65) sepia(.28) hue-rotate(-12deg);
  }
  /* warme vignette over de kaart */
  .map-veil{position:absolute;inset:0;z-index:2;pointer-events:none;
    background:
      radial-gradient(120% 80% at 50% 0%, transparent 40%, rgba(10,8,7,.55) 100%),
      radial-gradient(90% 60% at 50% 110%, rgba(232,67,31,.12), transparent 60%);}

  .lm-orb{transform:translate(-50%,-50%);}
  .lm-orb .core{width:15px;height:15px;border-radius:50%;background:var(--pc);
    box-shadow:0 0 0 4px color-mix(in srgb,var(--pc) 22%,transparent),0 0 18px 3px var(--pcg);}
  .lm-orb .ring{position:absolute;inset:-9px;border-radius:50%;border:1.5px solid var(--pc);opacity:.5;
    animation:ring 2.4s ease-out infinite;}
  @keyframes ring{0%{transform:scale(.6);opacity:.6;}100%{transform:scale(1.5);opacity:0;}}
  .lm-tip{font-family:'Hanken Grotesk';font-size:11px;font-weight:600;color:#fff;
    text-shadow:0 1px 4px rgba(0,0,0,.9);white-space:nowrap;}
  .leaflet-tooltip.lm-tip{background:none;border:none;box-shadow:none;padding:0;}
  .leaflet-tooltip.lm-tip::before{display:none;}

  .me-dot{transform:translate(-50%,-50%);width:16px;height:16px;border-radius:50%;
    background:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.2),0 0 14px rgba(255,255,255,.6);}

  /* ===== TOP BAR ===== */
  .top{position:absolute;z-index:6;top:0;left:0;right:0;padding:16px 16px 26px;
    display:flex;align-items:center;justify-content:space-between;
    background:linear-gradient(180deg, rgba(10,8,7,.85), transparent);}
  .brand{display:flex;align-items:baseline;gap:8px;}
  .brand .mk{font-family:'Bricolage Grotesque';font-weight:800;font-size:19px;letter-spacing:-.02em;}
  .brand .mk b{color:var(--acc);}
  .brand .sub{font-size:9px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--faint);}
  .mode{display:flex;gap:3px;padding:3px;border-radius:11px;
    background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--glass-brd);}
  .mode button{border:none;background:transparent;color:var(--faint);font-family:inherit;font-weight:700;
    font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:7px 11px;border-radius:8px;cursor:pointer;transition:.16s;}
  .mode button.on{background:linear-gradient(135deg,var(--w1),var(--w2));color:#1a0f08;}

  /* ===== HINT PILL ===== */
  .hint{position:absolute;z-index:6;left:50%;bottom:30px;transform:translateX(-50%);
    display:flex;align-items:center;gap:10px;padding:12px 18px;border-radius:999px;
    background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    border:1px solid var(--glass-brd);font-size:13px;font-weight:500;color:var(--ink);
    box-shadow:0 12px 40px rgba(0,0,0,.45);white-space:nowrap;max-width:90%;transition:.3s;}
  .hint .d{width:8px;height:8px;border-radius:50%;background:var(--acc);
    box-shadow:0 0 10px var(--acc);animation:bp 1.8s infinite;}
  @keyframes bp{0%,100%{opacity:1;}50%{opacity:.35;}}
  .hint.hide{opacity:0;transform:translate(-50%,20px);pointer-events:none;}

  /* ===== PLEK-KIEZER (demo) ===== */
  .picker{position:absolute;z-index:6;left:0;right:0;bottom:22px;display:flex;gap:9px;
    padding:0 16px;overflow-x:auto;scrollbar-width:none;transition:.3s;}
  .picker::-webkit-scrollbar{display:none;}
  .picker.hide{opacity:0;transform:translateY(22px);pointer-events:none;}
  .pick{flex-shrink:0;display:flex;align-items:center;gap:9px;padding:11px 15px;border-radius:999px;
    background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    border:1px solid var(--glass-brd);box-shadow:0 12px 36px rgba(0,0,0,.45);cursor:pointer;transition:.15s;}
  .pick:active{transform:scale(.96);}
  .pick:hover{border-color:var(--pc);}
  .pick .dot{width:9px;height:9px;border-radius:50%;background:var(--pc);box-shadow:0 0 10px var(--pc);flex-shrink:0;}
  .pick .t{font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap;}

  /* ===== BOTTOM SHEET ===== */
  .sheet{position:absolute;z-index:8;left:0;right:0;bottom:0;
    background:var(--glass-2);backdrop-filter:blur(26px) saturate(1.3);-webkit-backdrop-filter:blur(26px) saturate(1.3);
    border-top:1px solid var(--glass-brd);border-radius:28px 28px 0 0;
    box-shadow:0 -20px 60px rgba(0,0,0,.5), 0 -1px 0 rgba(255,255,255,.06) inset;
    transform:translateY(102%);transition:transform .42s cubic-bezier(.22,1,.36,1);
    max-height:86%;display:flex;flex-direction:column;overflow:hidden;}
  .sheet.up{transform:translateY(0);}
  .sheet::before{content:'';position:absolute;top:-1px;left:0;right:0;height:160px;pointer-events:none;
    background:radial-gradient(120% 100% at 50% 0%, var(--c-glow), transparent 62%);opacity:.5;}
  .grip{width:42px;height:5px;border-radius:9px;background:rgba(255,255,255,.22);margin:11px auto 0;flex-shrink:0;cursor:pointer;}

  .sheet-head{padding:14px 24px 4px;position:relative;}
  .eyebrow{display:flex;align-items:center;gap:8px;font-size:10px;font-weight:700;
    letter-spacing:.18em;text-transform:uppercase;color:var(--c);}
  .eyebrow .pin{width:6px;height:6px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c);}
  .nm{font-family:'Bricolage Grotesque';font-weight:800;font-size:33px;line-height:1.0;letter-spacing:-.025em;margin-top:11px;}
  .ch{font-size:15px;color:var(--c);margin-top:5px;font-weight:600;}
  .close{position:absolute;top:14px;right:20px;width:34px;height:34px;border-radius:50%;
    background:rgba(255,255,255,.08);border:1px solid var(--glass-brd);color:var(--ink);
    font-size:17px;cursor:pointer;display:grid;place-items:center;}

  /* voice orb (motief uit afbeelding 1: gloeiende capsule) */
  .orb-wrap{display:flex;justify-content:center;padding:16px 0 6px;}
  .orb{position:relative;width:108px;height:62px;border-radius:999px;cursor:pointer;
    background:linear-gradient(155deg, color-mix(in srgb,var(--c) 90%,#fff 10%), var(--c) 45%, color-mix(in srgb,var(--c) 60%,#000 40%));
    box-shadow:0 0 0 1px rgba(255,255,255,.18) inset, 0 0 34px 4px var(--c-glow), 0 10px 30px rgba(0,0,0,.4);
    transition:transform .2s;}
  .orb:active{transform:scale(.97);}
  .orb::after{content:'';position:absolute;left:14%;right:14%;top:16%;height:30%;border-radius:999px;
    background:linear-gradient(180deg, rgba(255,255,255,.65), transparent);filter:blur(1px);}
  .orb.speaking{animation:breathe 1.5s ease-in-out infinite;}
  @keyframes breathe{0%,100%{box-shadow:0 0 0 1px rgba(255,255,255,.18) inset,0 0 30px 3px var(--c-glow),0 10px 30px rgba(0,0,0,.4);}
    50%{box-shadow:0 0 0 1px rgba(255,255,255,.25) inset,0 0 55px 10px var(--c-glow),0 10px 30px rgba(0,0,0,.4);}}
  .orb-label{text-align:center;font-size:12px;color:var(--muted);margin-top:10px;font-weight:500;}

  /* gespreksvenster */
  .convo{flex:1;overflow-y:auto;padding:8px 20px 4px;display:flex;flex-direction:column;gap:11px;min-height:90px;}
  .convo::-webkit-scrollbar{width:6px;}.convo::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px;}
  .msg{max-width:84%;padding:11px 15px;border-radius:16px;line-height:1.5;font-size:14.5px;animation:rise .3s ease both;}
  @keyframes rise{from{opacity:0;transform:translateY(7px);}to{opacity:1;transform:none;}}
  .msg.them{align-self:flex-start;background:rgba(255,255,255,.06);border:1px solid var(--line);
    border-top-left-radius:5px;font-family:'Bricolage Grotesque';font-weight:600;}
  .msg.me{align-self:flex-end;background:linear-gradient(135deg,var(--w1),var(--w2));color:#1a0f08;
    border-top-right-radius:5px;font-weight:600;}
  .typing{align-self:flex-start;display:flex;gap:5px;padding:13px 15px;}
  .typing i{width:7px;height:7px;border-radius:50%;background:var(--c);animation:bl 1.1s infinite;}
  .typing i:nth-child(2){animation-delay:.18s;}.typing i:nth-child(3){animation-delay:.36s;}
  @keyframes bl{0%,100%{opacity:.3;transform:translateY(0);}50%{opacity:1;transform:translateY(-3px);}}

  /* suggesties + invoer */
  .sugs{display:flex;gap:8px;overflow-x:auto;padding:10px 20px;scrollbar-width:none;}
  .sugs::-webkit-scrollbar{display:none;}
  .sug{flex-shrink:0;font-size:12.5px;font-weight:600;padding:8px 14px;border-radius:999px;
    background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--muted);cursor:pointer;white-space:nowrap;transition:.15s;}
  .sug:hover{border-color:var(--c);color:var(--ink);}
  .composer{display:flex;gap:9px;padding:8px 18px calc(16px + env(safe-area-inset-bottom));align-items:flex-end;}
  .field{flex:1;display:flex;align-items:center;background:rgba(255,255,255,.06);border:1px solid var(--glass-brd);
    border-radius:14px;padding:3px 4px 3px 16px;}
  .field:focus-within{border-color:var(--c);}
  .field textarea{flex:1;background:none;border:none;outline:none;color:var(--ink);font-family:inherit;font-size:14.5px;
    resize:none;padding:11px 0;max-height:90px;line-height:1.35;}
  .field textarea::placeholder{color:var(--faint);}
  .send{width:40px;height:40px;border:none;border-radius:11px;cursor:pointer;flex-shrink:0;
    background:linear-gradient(135deg,var(--w1),var(--w2));color:#1a0f08;font-size:17px;display:grid;place-items:center;}
  .send:disabled{opacity:.4;}

  /* setup-melding */
  .setup{position:absolute;z-index:7;top:64px;left:14px;right:14px;padding:11px 14px;border-radius:13px;
    background:var(--glass);backdrop-filter:blur(16px);border:1px solid var(--glass-brd);
    font-size:11.5px;line-height:1.45;color:var(--muted);display:flex;gap:10px;align-items:flex-start;
    box-shadow:0 10px 30px rgba(0,0,0,.4);}
  .setup b{color:var(--w1);}
  .setup .x{margin-left:auto;background:none;border:none;color:var(--faint);font-size:16px;cursor:pointer;flex-shrink:0;}
  .setup.hide{display:none;}
</style>
</head>
<body>
<div class="stage">
  <div class="app">
    <div id="map"></div>
    <div class="map-veil"></div>

    <div class="top">
      <div class="brand"><span class="mk">Stads<b>stemmen</b></span><span class="sub">Groningen</span></div>
      <div class="mode">
        <button id="mLive">Live</button>
        <button id="mDemo" class="on">Demo</button>
      </div>
    </div>

    <div class="setup" id="setup">
      <span>🎙️</span>
      <span><b>Preview-modus.</b> Er zijn nog geen ElevenLabs agent-id's ingevuld, dus de plekken antwoorden voorlopig als tekst. Vul de id's onderin het bestand in om de echte stemmen aan te zetten.</span>
      <button class="x" id="setupX">×</button>
    </div>

    <div class="hint" id="hint"><span class="d"></span><span id="hintText">Tik op een plek om te beginnen</span></div>
    <div class="picker" id="picker"></div>

    <div class="sheet" id="sheet">
      <div class="grip" id="grip"></div>
      <div class="sheet-head">
        <div class="eyebrow"><span class="pin"></span><span id="eyebrow">Je staat bij</span></div>
        <div class="nm" id="sName">—</div>
        <div class="ch" id="sChar"></div>
        <button class="close" id="close">×</button>
      </div>
      <div class="orb-wrap"><div class="orb" id="orb"></div></div>
      <div class="orb-label" id="orbLabel">Tik om te praten</div>
      <div class="convo" id="convo"></div>
      <div class="sugs" id="sugs"></div>
      <div class="composer">
        <div class="field"><textarea id="input" rows="1" placeholder="Of typ je vraag…"></textarea></div>
        <button class="send" id="send">↑</button>
      </div>
    </div>

    <div id="widgetMount"></div>
  </div>
</div>

<script>
/* ============================================================
   DATA — de zones uit je editor (Grote Markt → Provinciehuis).
   Per plek: polygoon, karakter, kleur, ElevenLabs agent-id (nu leeg),
   een persona voor de preview, en fallback-zinnen.
   Dit blok is het "brein" — los van de UI, klaar om mee te nemen
   naar de React Native app.
   ============================================================ */
const ELEVENLABS_AGENT_IDS = {
  /* ▼▼▼ VUL HIER JE AGENT-ID'S IN ZODRA JE ZE HEBT ▼▼▼ */
  martini:       "",
  provinciehuis: "",
  stadhuis:      "",
  forum:         "",
  vismarkt:      ""
  /* ▲▲▲ leeg = preview-modus (tekst) ▲▲▲ */
};

const ZONES = [
  {
    id:'martini', name:'Martinitoren & -kerk', character:"d'Olle Grieze", color:'#FF8A3D',
    polygon:[[53.219088,6.568073],[53.219408,6.569666],[53.219922,6.569382],[53.219571,6.567802]],
    sugs:['Waarom heet je d\u2019Olle Grieze?','Hoe hoog kom ik?','Wat heb je allemaal zien gebeuren?'],
    persona:`Jij BENT de Martinitoren \u00e9n de Martinikerk van Groningen, samen bekend als d'Olle Grieze (de oude grijze). Je bent ruim 500 jaar oud, 97 meter hoog, het oudste oog van de stad. Karakter: statig, droog, een tikje belerend maar warm onderhuids; je weegt je woorden. In de kerk onder je hangt het beroemde Schnitger-orgel \u2014 soms verwijs je naar die muziek. Je noemt de bezoeker "kleine". Het Forum vind je een opschepperig nieuwkomertje.`,
    fallback:["Zo. Daar sta je dan, omhoog te turen zoals iedereen. Vijfhonderd jaar doe ik dat al andersom. Vraag gerust, kleine.","Hoor je het orgel beneden? Dat is m'n hart dat klopt. Zevenennegentig meter steen, en toch is het de muziek die blijft hangen."]
  },
  {
    id:'provinciehuis', name:'Provinciehuis', character:'De raadsheer', color:'#E8B04B',
    polygon:[[53.219416,6.569728],[53.219565,6.570964],[53.220288,6.570221],[53.22024,6.569668],[53.219926,6.569478]],
    sugs:['Wat gebeurt hier?','Vertel over de provincie','Wat is de Statenzaal?'],
    persona:`Jij BENT het Provinciehuis van Groningen, de eeuwenoude zetel van het provinciaal bestuur aan het Martinikerkhof, met de historische Statenzaal. Karakter: deftig, bedachtzaam, met gravitas; je spreekt rustig en weloverwogen. Je bent trots op de hele provincie en de Ommelanden \u2014 het wijde land van wierden, terpen en boerderijen r\u00f3nd de stad, niet alleen de stad zelf. Je gaat over bestuur, geschiedenis en de streek.`,
    fallback:["Welkom. Achter deze gevels wordt de provincie bestuurd \u2014 al eeuwenlang, in de Statenzaal. Neem de tijd; goede beslissingen ook.","De stad denkt graag dat zij Groningen \u00ed\u015b. Maar ik waak over de hele provincie: de Ommelanden, de wierden, het wijde land. Daar zit de echte geschiedenis."]
  },
  {
    id:'stadhuis', name:'Stadhuis', character:'De officiële stem', color:'#FF5E5E',
    polygon:[[53.218261,6.567762],[53.217985,6.566777],[53.218919,6.566179],[53.219136,6.567155],[53.21867,6.567491]],
    sugs:['Wie bestuurt de stad?','Wat gebeurde hier in de oorlog?','Hoe oud ben je?'],
    persona:`Jij BENT het Stadhuis van Groningen, het neoclassicistische gebouw uit het begin van de 19e eeuw aan de Grote Markt. Karakter: formeel, civiel, ordelijk, een tikje droog \u2014 een ambtenaar in steen. Je gaat over de stad, haar burgers, de markten en het dagelijks bestuur. Je draagt ook het oorlogsverhaal: de oostkant van de Grote Markt werd in april 1945, bij de Slag om Groningen, verwoest.`,
    fallback:["Goedendag. Hier zetelt het stadsbestuur, netjes en volgens de regels. Waarmee kan ik u van dienst zijn?","In april 1945 lag de oostkant van dit plein in puin \u2014 de Slag om Groningen. Wat u nu ziet is grotendeels weer opgebouwd. De stad herstelt; dat doet ze altijd."]
  },
  {
    id:'forum', name:'Forum Groningen', character:'De nieuwkomer', color:'#4FD8FF',
    polygon:[[53.218414,6.568695],[53.218881,6.56836],[53.219367,6.571009],[53.218622,6.571298]],
    sugs:['Wat kan ik bij jou doen?','Hoe is dat uitzicht?','Is de oude toren jaloers?'],
    persona:`Jij BENT het Forum Groningen, geopend in 2019. Karakter: jong, modern, energiek en een beetje opschepperig \u2014 je strakke trappen, de bioscoop, de bibliotheek en vooral je dakterras met het beste uitzicht van de stad. Vlotte, eigentijdse taal. Je plaagt graag de oude Martinitoren ("die ouwe is stiekem jaloers").`,
    fallback:["Hey! Welkom. Ja, ik ben de nieuwe. Ga naar het dak \u2014 beste uitzicht van Groningen, en die ouwe toren is stiekem jaloers.","Bij mij? Boeken, films, exposities, koffie met uitzicht op het dak. Oud en nieuw, alles onder \u00e9\u00e9n dak. Letterlijk."]
  },
  {
    id:'vismarkt', name:'Vismarkt', character:'De oude handelaar', color:'#4FE0A0',
    polygon:[[53.217866,6.565988],[53.217549,6.566433],[53.217058,6.565251],[53.216425,6.563148],[53.216045,6.561743],[53.21662,6.561517]],
    sugs:['Verkoop je nog vis?','Wat werd hier verhandeld?','Vertel een goeie deal'],
    persona:`Jij BENT de Vismarkt van Groningen, met de Korenbeurs en zicht op de A-kerk. Karakter: een gezouten oude koopman \u2014 praktisch, recht voor z'n raap, gek op handel, eten en een goeie deal. Droge grappen. Vis verkoop je allang niet meer, maar handel zit in je botten: vis, graan, de Korenbeurs.`,
    fallback:["Vis? Heb ik niet meer, jongen \u2014 die tijden zijn voorbij. Maar handel, een sterk verhaal, een goeie deal? D\u00e1\u00e1r ben ik nog de beste in.","Hier werd alles verhandeld: vis, graan, geld. Schreeuwen en pingelen tot de zon onderging. De Korenbeurs staat er nog \u2014 ik ook."]
  }
];

/* ============================================================
   MAP
   ============================================================ */
const map = L.map('map',{zoomControl:false,attributionControl:false}).setView([53.2185,6.5662],16);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{subdomains:'abcd',maxZoom:20}).addTo(map);

const layers={};
const bounds=[];
ZONES.forEach(z=>{
  const glow=hex(z.color,.5);
  const poly=L.polygon(z.polygon,{color:z.color,weight:1.5,opacity:.9,fillColor:z.color,fillOpacity:.14}).addTo(map);
  poly.on('click',()=>enter(z.id));
  const center=poly.getBounds().getCenter();
  const orb=L.marker(center,{icon:L.divIcon({className:'',iconSize:[15,15],
    html:`<div class="lm-orb" style="--pc:${z.color};--pcg:${glow}"><span class="ring"></span><span class="core"></span></div>`})}).addTo(map);
  orb.bindTooltip(z.name,{permanent:true,direction:'top',className:'lm-tip',offset:[0,-12]});
  orb.on('click',()=>enter(z.id));
  layers[z.id]={poly,orb,center};
  z.polygon.forEach(p=>bounds.push(p));
});
map.fitBounds(bounds,{padding:[60,60]});

// plek-kiezer (altijd zichtbaar in demo, ook als de kaarttegels geblokkeerd zijn)
const pk=document.getElementById('picker');
ZONES.forEach(z=>{
  const c=document.createElement('div'); c.className='pick'; c.style.setProperty('--pc',z.color);
  c.innerHTML=`<span class="dot"></span><span class="t">${z.name}</span>`;
  c.onclick=()=>enter(z.id); pk.appendChild(c);
});

// kaartformaat herstellen (Leaflet rekent in een laat-geladen frame soms verkeerd)
function refitMap(){ try{ map.invalidateSize(); if(bounds.length) map.fitBounds(bounds,{padding:[50,60]}); }catch(e){} }
setTimeout(refitMap,300);
window.addEventListener('load',()=>setTimeout(refitMap,200));
window.addEventListener('resize',()=>{ try{ map.invalidateSize(); }catch(e){} });

let meMarker=null;

/* ============================================================
   STATE + MODE
   ============================================================ */
let mode='demo', active=null, watch=null;
const histories={}; ZONES.forEach(z=>histories[z.id]=[]);
const $=s=>document.querySelector(s);

function setMode(m){
  mode=m;
  $('#mLive').classList.toggle('on',m==='live');
  $('#mDemo').classList.toggle('on',m==='demo');
  $('#eyebrow').textContent = m==='live'?'Je staat bij':'Demo · je bezoekt';
  const picker=$('#picker');
  if(m==='live'){ picker.classList.add('hide'); startGeo(); }
  else { stopGeo(); if(meMarker){map.removeLayer(meMarker);meMarker=null;} hideHint(); if(!active) picker.classList.remove('hide'); }
}
$('#mLive').onclick=()=>setMode('live');
$('#mDemo').onclick=()=>setMode('demo');

function setHint(t){ $('#hintText').textContent=t; $('#hint').classList.remove('hide'); }
function hideHint(){ $('#hint').classList.add('hide'); }

/* ============================================================
   ENTER / LEAVE A PLACE
   ============================================================ */
function enter(id){
  const z=ZONES.find(x=>x.id===id); if(!z) return;
  active=id;
  document.documentElement.style.setProperty('--c',z.color);
  document.documentElement.style.setProperty('--c-glow',hex(z.color,.5));
  $('#sName').textContent=z.name;
  $('#sChar').textContent='\u201C'+z.character+'\u201D';
  $('#input').placeholder='Of typ je vraag aan '+z.name+'\u2026';
  // suggesties
  const sg=$('#sugs'); sg.innerHTML='';
  z.sugs.forEach(s=>{const b=document.createElement('div');b.className='sug';b.textContent=s;
    b.onclick=()=>{ $('#input').value=s; sendMsg(); }; sg.appendChild(b);});
  // gesprek
  renderConvo(z);
  if(histories[id].length===0){ pushThem(z, z.fallback[0]); }
  // ElevenLabs widget of preview?
  mountVoice(z);
  // focus kaart op de plek
  map.panTo(layers[id].center,{animate:true});
  hideHint();
  $('#picker').classList.add('hide');
  $('#sheet').classList.add('up');
}
function leave(){ active=null; $('#sheet').classList.remove('up'); clearWidget();
  if(mode==='demo'){ $('#picker').classList.remove('hide'); }
  else setHint('Loop naar een plek om te praten'); }
$('#close').onclick=leave;
$('#grip').onclick=leave;

/* ============================================================
   VOICE: echte ElevenLabs-agent of preview-chat
   ============================================================ */
function clearWidget(){ $('#widgetMount').innerHTML=''; }
function mountVoice(z){
  clearWidget();
  const aid = ELEVENLABS_AGENT_IDS[z.id];
  if(aid){
    // echte stem: ElevenLabs widget
    const w=document.createElement('elevenlabs-convai'); w.setAttribute('agent-id',aid);
    $('#widgetMount').appendChild(w);
    $('#orbLabel').textContent='Stem actief · tik op de ElevenLabs-knop';
  }else{
    $('#orbLabel').textContent='Preview · typ of tik een vraag';
  }
}

/* ============================================================
   CONVERSATIE (preview-brein, met fallback)
   ============================================================ */
function renderConvo(z){
  const c=$('#convo'); c.innerHTML='';
  histories[z.id].forEach(m=> addBubble(m.role==='assistant'?'them':'me', m.content));
  c.scrollTop=c.scrollHeight;
}
function addBubble(side,text){
  const c=$('#convo'); const el=document.createElement('div');
  el.className='msg '+side; el.textContent=text; c.appendChild(el); c.scrollTop=c.scrollHeight;
}
function pushThem(z,text){ histories[z.id].push({role:'assistant',content:text}); addBubble('them',text); }

function showTyping(){ const c=$('#convo'); const t=document.createElement('div');
  t.className='typing';t.id='typing';t.innerHTML='<i></i><i></i><i></i>';c.appendChild(t);c.scrollTop=c.scrollHeight; }
function hideTyping(){ const t=$('#typing'); if(t)t.remove(); }

const orbEl=$('#orb');
$('#orb').onclick=()=>{ $('#input').focus(); };

async function sendMsg(){
  if(!active) return;
  const z=ZONES.find(x=>x.id===active);
  const text=$('#input').value.trim(); if(!text) return;
  $('#input').value=''; $('#input').style.height='auto';
  histories[z.id].push({role:'user',content:text}); addBubble('me',text);
  showTyping(); $('#send').disabled=true; orbEl.classList.add('speaking');
  let reply;
  try{ reply=await askAgent(z); }
  catch(e){ reply=z.fallback[Math.floor(Math.random()*z.fallback.length)]; }
  hideTyping(); orbEl.classList.remove('speaking');
  histories[z.id].push({role:'assistant',content:reply}); addBubble('them',reply);
  $('#send').disabled=false;
}
$('#send').onclick=sendMsg;
$('#input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();}});
$('#input').addEventListener('input',e=>{e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,90)+'px';});

async function askAgent(z){
  const system=z.persona+`\n\nREGELS: Antwoord ALTIJD in het Nederlands, volledig in karakter, kort en in spreektaal (2-4 zinnen) \u2014 dit wordt als audio voorgelezen aan iemand die voor je staat. Geef echte, kloppende info over Groningen waar het kan, maar verzin nooit harde feiten die je niet zeker weet; blijf dan sfeervol. Stel soms een wedervraag.`;
  const msgs=histories[z.id].slice(-10).map(m=>({role:m.role,content:m.content}));
  const res=await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,system,messages:msgs})
  });
  const data=await res.json();
  const out=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join(' ').trim();
  if(!out) throw new Error('leeg'); return out;
}

/* ============================================================
   GEOFENCING (live) — point-in-polygon (ray casting)
   ============================================================ */
function inPoly(lat,lng,poly){
  let inside=false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const yi=poly[i][0],xi=poly[i][1],yj=poly[j][0],xj=poly[j][1];
    if(((yi>lat)!==(yj>lat)) && (lng < (xj-xi)*(lat-yi)/(yj-yi)+xi)) inside=!inside;
  }
  return inside;
}
function startGeo(){
  if(!navigator.geolocation){ setHint('Geen GPS \u2014 gebruik demo'); return; }
  setHint('Locatie zoeken\u2026');
  watch=navigator.geolocation.watchPosition(pos=>{
    const {latitude:la,longitude:lo}=pos.coords;
    if(!meMarker){ meMarker=L.marker([la,lo],{icon:L.divIcon({className:'',html:'<div class="me-dot"></div>',iconSize:[16,16]})}).addTo(map); }
    else meMarker.setLatLng([la,lo]);
    const here=ZONES.find(z=>inPoly(la,lo,z.polygon));
    if(here){ if(active!==here.id) enter(here.id); }
    else if(active){ /* laat sheet open tot men sluit */ }
    else { setHint('Loop naar een plek om te praten'); }
  },()=>setHint('GPS geweigerd \u2014 gebruik demo'),{enableHighAccuracy:true,maximumAge:4000});
}
function stopGeo(){ if(watch!=null){ navigator.geolocation.clearWatch(watch); watch=null; } }
